# Refreshes the Haifa supermarket prices in public/prices/ and commits them,
# which makes Netlify publish them with the app.
#
# Commits are authored as Almog: Netlify's free plan refuses to build a
# private repo for any other Git contributor (a bot author fails the deploy).
name: Update prices

on:
  schedule:
    # UTC, every other day: each price commit is a Netlify deploy, and the
    # free plan's credits can't cover two a day. The chains post their full
    # lists overnight, so 06:30 UTC (08:30-09:30 in Israel) gets fresh ones.
    - cron: "30 6 */2 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests==2.32.3

      # Keep going if one chain fails: the script keeps its old files, and
      # this step's failure is reported after the rest is committed.
      - name: Fetch prices
        id: fetch
        continue-on-error: true
        run: python scripts/fetch_prices.py

      - name: Commit
        run: |
          git config user.name "Almog Hadad"
          git config user.email "almoghadad11@gmail.com"
          git add public/prices
          if git diff --cached --quiet; then
            echo "No price changes."
            exit 0
          fi
          git commit -m "Update supermarket prices"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Report a failed fetch
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "::error::At least one chain failed to update; its old prices were kept."
          exit 1
