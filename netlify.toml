# Static site — nothing to build, just publish the folder.
[build]
  publish = "public"

[[headers]]
  for = "/sw.js"
  [headers.values]
    # The worker must never be served stale, or a deploy can't reach devices
    # that already installed an older one.
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    # Netlify guesses octet-stream for this extension, and that is the file
    # Android reads to decide the app is installable to the home screen.
    Content-Type = "application/manifest+json"
