<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Market Run</title>
<meta name="description" content="רשימת קניות משותפת לשניים.">
<!-- The list is reachable by anyone holding the link; keep it out of search. -->
<meta name="robots" content="noindex, nofollow">

<meta name="theme-color" content="#F3F4EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12140F" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<!-- Safari ignores SVG here, so the home-screen icon has to be a PNG. -->
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Market Run">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Heebo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

<style>
/* Baseline the page depends on. [hidden] must beat display:flex — the dock,
   progress bar and sheets are all flex containers toggled by that attribute. */
*{box-sizing:border-box}
html,body{margin:0;padding:0}
img{max-width:100%}
[hidden]{display:none!important}

:root{
  color-scheme: light;
  --ground:#F3F4EF;
  --surface:#FFFFFF;
  --surface-2:#EAECE4;
  --ink:#191C16;
  --ink-muted:#5E6357;
  --ink-faint:#8E9385;
  --line:#DDE0D6;
  --line-strong:#C3C8B8;
  --accent:#2E6B4A;
  --accent-ink:#FFFFFF;
  --accent-soft:#E2EFE7;
  --danger:#9B3220;
  --shadow:0 1px 2px rgba(25,28,22,.06), 0 8px 24px rgba(25,28,22,.06);
  --dock-shadow:0 -1px 0 var(--line), 0 -10px 24px rgba(25,28,22,.05);

  /* Heebo carries the Hebrew; Bricolage is kept only for the Latin wordmark. */
  --display:"Heebo","Bricolage Grotesque",system-ui,sans-serif;
  --brand:"Bricolage Grotesque","Heebo",system-ui,sans-serif;
  --body:"Heebo",system-ui,-apple-system,Segoe UI,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --ground:#12140F;
    --surface:#1B1E17;
    --surface-2:#23271E;
    --ink:#E9EBE1;
    --ink-muted:#A0A594;
    --ink-faint:#767B6B;
    --line:#2C3126;
    --line-strong:#3C4234;
    --accent:#6FBE8E;
    --accent-ink:#0F2218;
    --accent-soft:#1E2E24;
    --danger:#E0715A;
    --shadow:0 1px 2px rgba(0,0,0,.45), 0 8px 24px rgba(0,0,0,.35);
    --dock-shadow:0 -1px 0 var(--line), 0 -10px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --ground:#12140F;
  --surface:#1B1E17;
  --surface-2:#23271E;
  --ink:#E9EBE1;
  --ink-muted:#A0A594;
  --ink-faint:#767B6B;
  --line:#2C3126;
  --line-strong:#3C4234;
  --accent:#6FBE8E;
  --accent-ink:#0F2218;
  --accent-soft:#1E2E24;
  --danger:#E0715A;
  --shadow:0 1px 2px rgba(0,0,0,.45), 0 8px 24px rgba(0,0,0,.35);
  --dock-shadow:0 -1px 0 var(--line), 0 -10px 24px rgba(0,0,0,.35);
}

body{
  background:var(--ground);
  color:var(--ink);
  font-family:var(--body);
  font-size:16px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{margin:0;text-wrap:balance}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}
/* Digits stay left-to-right inside RTL text. */
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}

.app{max-width:600px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;background:var(--ground)}

/* ---------- header ---------- */
.topbar{
  position:sticky;top:0;z-index:20;
  display:flex;align-items:center;gap:12px;
  padding:14px 18px 12px;
  background:var(--ground);
  border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:9px;margin-inline-end:auto;min-width:0}
.brand svg{width:21px;height:21px;color:var(--accent);flex:none}
.brand h1{
  font-family:var(--brand);font-weight:800;font-size:20px;letter-spacing:-.02em;
  white-space:nowrap;direction:ltr;
}
.icon-btn{
  width:38px;height:38px;display:grid;place-items:center;border-radius:9px;color:var(--ink-muted);
}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.icon-btn svg{width:20px;height:20px}

.person{
  width:26px;height:26px;border-radius:50%;flex:none;
  display:grid;place-items:center;
  font-size:11px;font-weight:700;
  color:#fff;background:var(--ink-faint);
  user-select:none;
}

/* ---------- scroll area ---------- */
.scroll{flex:1;padding:0 18px 8px}

/* ---------- add bar ---------- */
.addwrap{position:relative;padding-top:16px}
.addbar{display:flex;gap:8px}
.addbar input{
  flex:1;min-width:0;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:11px;
  padding:13px 14px;
  box-shadow:var(--shadow);
}
.addbar input::placeholder{color:var(--ink-faint)}
.addbar input:focus{border-color:var(--accent);outline:none}
.addbar button{
  background:var(--accent);color:var(--accent-ink);
  border-radius:11px;padding:0 20px;font-weight:600;
  box-shadow:var(--shadow);
}
.addbar button:hover{filter:brightness(1.06)}

.suggest{
  position:absolute;inset-inline:0;top:calc(100% + 6px);z-index:15;
  background:var(--surface);border:1px solid var(--line);border-radius:11px;
  box-shadow:var(--shadow);overflow:hidden;
}
.suggest button{
  display:flex;width:100%;align-items:center;gap:10px;
  padding:12px 14px;text-align:start;border-bottom:1px solid var(--line);
}
.suggest button:last-child{border-bottom:none}
.suggest button:hover,.suggest button[data-active="1"]{background:var(--accent-soft)}
.suggest .s-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.suggest .s-sub{font-size:13px;color:var(--ink-muted)}
.suggest button.s-cmd .s-name{color:var(--accent);font-weight:600}
.suggest button:disabled{color:var(--ink-faint);cursor:default;background:none}
.suggest button:disabled:hover{background:none}

/* ---------- progress ---------- */
.progress{margin-top:18px;display:flex;align-items:center;gap:12px}
.pbar{flex:1;height:4px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .25s ease}
.ptext{flex:none;font-size:12px;color:var(--ink-faint)}

/* ---------- list ---------- */
.aisle{margin-top:22px}
.aisle-head{
  display:flex;align-items:center;gap:8px;
  padding:0 2px 7px;border-bottom:1px solid var(--line-strong);
}
.aisle-head .ico{font-size:15px;line-height:1;flex:none;width:19px;text-align:center}
.aisle-head h2{
  font-family:var(--display);font-weight:700;font-size:13.5px;
  color:var(--ink-muted);
}
.aisle-head .count{font-size:11.5px;color:var(--ink-faint);margin-inline-start:auto}

.row{
  display:flex;align-items:center;gap:12px;
  padding:14px 2px;
  border-bottom:1px solid var(--line);
}
.row[data-done="1"] .r-name{text-decoration:line-through;color:var(--ink-faint)}
.row[data-done="1"]{opacity:.6}

.check{
  width:30px;height:30px;flex:none;border-radius:50%;
  border:1.75px solid var(--line-strong);background:var(--surface);
  display:grid;place-items:center;
}
.check svg{width:16px;height:16px;color:var(--accent-ink);opacity:0;stroke-width:3}
.row[data-done="1"] .check{background:var(--accent);border-color:var(--accent)}
.row[data-done="1"] .check svg{opacity:1}

.r-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;text-align:start}
.r-name{font-weight:500;overflow-wrap:anywhere}
.r-sub{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-faint)}
.qty{
  font-family:var(--mono);font-size:11.5px;font-weight:500;
  background:var(--surface-2);color:var(--ink-muted);
  padding:1px 6px;border-radius:3px;direction:ltr;unicode-bidi:isolate;
}
.r-more{
  width:34px;height:34px;flex:none;display:grid;place-items:center;
  border-radius:8px;color:var(--ink-faint);
}
.r-more:hover{background:var(--surface-2);color:var(--ink)}
.r-more svg{width:18px;height:18px}
/* Photo attached to an item — a tap opens it full size. */
.r-thumb{
  width:40px;height:40px;flex:none;padding:0;overflow:hidden;
  border-radius:8px;border:1px solid var(--line);background:var(--surface-2);
}
.r-thumb:hover{border-color:var(--line-strong)}
.r-thumb img{display:block;width:100%;height:100%;object-fit:cover}

/* ---------- empty / done ---------- */
.empty{
  margin-top:26px;background:var(--surface);border:1px solid var(--line);
  border-radius:14px;padding:22px 20px;box-shadow:var(--shadow);
}
.empty h2{font-family:var(--display);font-weight:700;font-size:18px}
.empty p{margin:7px 0 0;color:var(--ink-muted);font-size:14.5px;max-width:48ch}
.empty .hint{margin-top:13px;font-size:13px;color:var(--ink-faint)}
.kbd{
  font-size:12.5px;
  background:var(--surface-2);color:var(--ink-muted);
  padding:1px 6px;border-radius:4px;white-space:nowrap;
  unicode-bidi:isolate;
}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:16px}
.chip{
  display:flex;align-items:center;gap:6px;
  border:1px solid var(--line-strong);border-radius:999px;
  padding:7px 13px;font-size:14px;font-weight:500;color:var(--ink-muted);
  background:var(--ground);
}
.chip:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}

.donenote{margin-top:24px;text-align:center;padding:22px 16px;color:var(--ink-muted)}
.donenote .cheer{font-size:26px;line-height:1;margin-bottom:8px}
.donenote .big{font-family:var(--display);font-weight:700;font-size:17px;color:var(--ink)}
.donenote p{margin:5px 0 0;font-size:13.5px}

/* ---------- dock ---------- */
.dock{
  position:sticky;bottom:0;z-index:20;
  padding:12px 18px calc(12px + env(safe-area-inset-bottom));
  background:var(--ground);box-shadow:var(--dock-shadow);
  display:flex;gap:10px;
}
.btn{
  flex:1;border-radius:12px;padding:15px 18px;
  font-weight:600;font-size:15.5px;
  display:flex;align-items:center;justify-content:center;gap:9px;
}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{filter:brightness(1.06)}
.btn-ghost{flex:1;border:1px solid var(--line-strong);color:var(--ink-muted)}
.btn-ghost:hover{border-color:var(--ink-faint);color:var(--ink)}
.btn-danger{background:var(--danger);color:#fff}
.btn-danger:hover{filter:brightness(1.08)}
.btn .n{font-family:var(--mono);opacity:.75;font-weight:500;direction:ltr;unicode-bidi:isolate}

/* ---------- sheet ---------- */
.veil{
  position:fixed;inset:0;z-index:60;background:rgba(15,18,13,.42);
  display:flex;align-items:flex-end;justify-content:center;padding:16px;
}
@media (min-width:620px){.veil{align-items:center}}
.sheet{
  width:100%;max-width:568px;max-height:82dvh;overflow-y:auto;
  background:var(--ground);border:1px solid var(--line);
  border-radius:16px;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.3);
}
.sheet-head{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.sheet-head h2{font-family:var(--display);font-weight:800;font-size:19px;margin-inline-end:auto}
.sheet-row{display:flex;gap:10px;margin-top:4px}
.sublabel{font-size:13px;color:var(--ink-faint);margin:4px 0 10px;line-height:1.5}
.linkbtn{font-size:14.5px;color:var(--accent);font-weight:600;padding:10px 2px;text-align:start}
.linkbtn.danger{color:var(--danger)}

/* Sheet form — 16px inputs so iOS doesn't zoom the page on focus. */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.field label{font-size:12px;color:var(--ink-faint);font-weight:700}
.field input{
  background:var(--surface);border:1px solid var(--line);border-radius:11px;
  padding:14px;font-size:16px;width:100%;
}
.field input:focus{border-color:var(--accent);outline:none}
.field.narrow input{width:140px}
.apicks{display:flex;flex-wrap:wrap;gap:7px}
.apick{
  display:flex;align-items:center;gap:6px;
  border:1px solid var(--line);background:var(--surface);
  border-radius:999px;padding:9px 13px;font-size:14px;color:var(--ink-muted);
}
.apick[data-sel="1"]{
  border-color:var(--accent);background:var(--accent-soft);
  color:var(--accent);font-weight:600;
}
.imgpick{display:flex;flex-direction:column;align-items:flex-start;gap:10px}
.imgprev{
  display:block;max-width:100%;max-height:160px;
  border-radius:11px;border:1px solid var(--line);background:var(--surface);
}
.imgbtns{display:flex;flex-wrap:wrap;gap:7px}
.imgbtn{
  display:flex;align-items:center;gap:7px;
  border:1px solid var(--line);background:var(--surface);
  border-radius:999px;padding:9px 14px;font-size:14px;color:var(--ink-muted);
}
.imgbtn:hover{border-color:var(--accent);color:var(--accent)}
.imgbtn:disabled{border-color:var(--line);color:var(--ink-faint);cursor:default}
.imgbtn svg{width:17px;height:17px}
.viewer{
  display:block;width:100%;max-height:64dvh;object-fit:contain;
  border-radius:11px;background:var(--surface);
}

/* ---------- banner + toast ---------- */
.banner{
  margin:14px 18px 0;padding:11px 14px;border-radius:10px;
  background:var(--accent-soft);border:1px solid var(--line);
  font-size:13.5px;color:var(--ink-muted);
}
.toast{
  position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));
  transform:translateX(-50%);z-index:80;
  display:flex;align-items:center;gap:12px;
  background:var(--ink);color:var(--ground);
  padding:11px 18px;border-radius:999px;font-size:14px;font-weight:500;
  box-shadow:0 8px 28px rgba(0,0,0,.28);max-width:calc(100vw - 32px);
}
.toast.with-action{padding-block:9px;padding-inline:18px 9px}
.toast .msg{flex:1;min-width:0}
/* currentColor so the button flips with the toast between themes. */
.toast .undo{
  flex:none;color:inherit;font-weight:700;font-size:13.5px;
  padding:9px 15px;border-radius:999px;border:1px solid currentColor;
  opacity:.8;
}
.toast .undo:hover{opacity:1}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>

<div class="app">
  <header class="topbar">
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">

    <div class="person" id="me-chip" hidden></div>

      <div class="suggest" id="suggest" hidden></div>

      <div class="pbar"><i id="pbar-fill" style="width:0%"></i></div>
      <div class="ptext" id="ptext"></div>

    <div id="list-body"></div>
  </main>

  <div class="dock" id="dock" hidden></div>
</div>

<div class="veil" id="veil" hidden>

</div>

function el(tag, cls, text){
  var n = document.createElement(tag);
  if(cls) n.className = cls;
  if(text != null) n.textContent = text;
  return n;
}
function svg(paths, sw){
  var s = document.createElementNS("http://www.w3.org/2000/svg","svg");
  s.setAttribute("viewBox","0 0 24 24");
  s.setAttribute("fill","none");
  s.setAttribute("stroke","currentColor");
  s.setAttribute("stroke-width", sw || "2");
  s.setAttribute("stroke-linecap","round");
  s.setAttribute("stroke-linejoin","round");
  s.setAttribute("aria-hidden","true");
  paths.forEach(function(d){
    var p = document.createElementNS("http://www.w3.org/2000/svg","path");
    p.setAttribute("d", d); s.appendChild(p);
  });
  return s;
}
function slug(name){
  return String(name).toLowerCase().trim().replace(/\s+/g," ")
    .replace(/[^\p{L}\p{N} ]/gu,"").replace(/ /g,"-").slice(0,120) || "item";
}
function uid(){
  return Date.now().toString(36) + Math.random().toString(36).slice(2,7);
}

/* Hebrew final forms are the same letters: מלפפון and מלפפונים must match.
   Apostrophes go too — people type the Hebrew geresh ׳ while the keyword list
   is written with an ASCII ', and צ׳יפס would never match צ'יפס otherwise. */
function heNorm(s){
  return s.replace(/[׳״‘’“”'"]/g,"")
          .replace(/ך/g,"כ").replace(/ם/g,"מ").replace(/ן/g,"נ")
          .replace(/ף/g,"פ").replace(/ץ/g,"צ");
}
function matchKey(s){
  return heNorm(slug(s)).replace(/(יות|ים|ות)$/,"");
}

/* A Latin keyword must start a word, so "toilet paper" isn't cooking oil.
   Trailing letters are fine, so "cucumber" still catches "cucumbers". */
function wordHit(hay, needle){
  var i = hay.indexOf(needle);
  while(i !== -1){
    if(i === 0 || !/[a-z]/.test(hay.charAt(i-1))) return true;
    i = hay.indexOf(needle, i + 1);
  }
  return false;
}

/* Longest matching keyword wins, so "eggplant" beats "egg" and
   "ice cream" beats "cream" without depending on aisle order. */
function guessCat(name){
  var s = heNorm(String(name).toLowerCase());
  var bestKey = "other", bestLen = 0;
  for(var i=0;i<CATS.length;i++){
    var key = CATS[i][0], words = KEYWORDS[key] || [];
    for(var j=0;j<words.length;j++){
      var w = heNorm(words[j]);
      if(w.length <= bestLen) continue;
      var hit = HEBREW.test(w) ? (s.indexOf(w) !== -1) : wordHit(s, w);
      if(hit){ bestKey = key; bestLen = w.length; }
    }
  }
  return bestKey;
}
function catIcon(key){
  for(var i=0;i<CATS.length;i++){ if(CATS[i][0] === key) return CATS[i][2]; }
  return "📦";
}
function catLabel(key){
  for(var i=0;i<CATS.length;i++){ if(CATS[i][0] === key) return CATS[i][1]; }
  return "שונות";
}

/* "2 חלב", "חלב x2", "1kg עגבניות" -> {name, qty} */
function parseEntry(raw){
  var s = String(raw).trim().replace(/\s+/g," ");
  var qty = "";
  var m = s.match(/\s*[x×*]\s*(\d+(?:\.\d+)?)$/i);
  if(m){ qty = m[1]; s = s.slice(0, m.index).trim(); }
  if(!qty){
    var m2 = s.match(/^(\d+(?:[.,]\d+)?)\s*(kg|kgs|g|gr|gram|l|lt|ml|pack|packs|ק"ג|קג|גרם|ליטר)?\s+(.+)$/i);
    if(m2 && m2[3]){
      qty = m2[1].replace(",",".") + (m2[2] ? m2[2].toLowerCase() : "");
      s = m2[3].trim();
    }
  }
  return {name:s, qty:qty};
}
function multiplier(qty){
  var q = String(qty || "").trim();
  return /^\d+(\.\d+)?$/.test(q) ? parseFloat(q) : 1;
}

function sortedItems(){
  var arr = Object.keys(state.items).map(function(k){ return state.items[k]; });
  arr.sort(function(a,b){ return (a.ts||0) - (b.ts||0); });
  return arr;
}
function doneCount(){
  return Object.keys(state.items).filter(function(k){ return state.items[k].done; }).length;
}
function groupByAisle(arr){
  var groups = [];
  CATS.forEach(function(c){
    var of = arr.filter(function(it){ return (it.cat || "other") === c[0]; });
    if(of.length) groups.push({key:c[0], name:c[1], icon:c[2], items:of});
  });
  return groups;
}

/* Items on the list whose name the user could plausibly have meant. */
function findItems(q){
  var arr = sortedItems();
  var qs = slug(q), qk = matchKey(q);
  if(!qk) return [];
  var exact = arr.filter(function(it){ return slug(it.name) === qs; });
  if(exact.length) return exact;
  var keyed = arr.filter(function(it){ return matchKey(it.name) === qk; });
  if(keyed.length) return keyed;
  return arr.filter(function(it){
    var k = matchKey(it.name);
    return k && (k.indexOf(qk) !== -1 || qk.indexOf(k) !== -1);
  });
}

/* "תוריד מלפפון מהרשימה" -> {action:"removeItem", target:"מלפפון"} */
function parseCommand(raw){
  var s = String(raw).trim().replace(/\s+/g," ");
  if(!s) return null;
  var low = s.toLowerCase();

  var verb = null;
  for(var i=0;i<REMOVE_VERBS.length;i++){
    var v = REMOVE_VERBS[i];
    if(low.indexOf(v + " ") === 0){ verb = v; break; }
  }
  if(!verb) return null;

  var rest = s.slice(verb.length).trim();
  rest = rest.replace(/^(את|של|the|of)\s+/i,"").trim();
  for(var j=0;j<SCOPE_TAILS.length;j++){
    var tail = SCOPE_TAILS[j];
    if(rest.length > tail.length && rest.slice(-tail.length) === tail){
      rest = rest.slice(0, -tail.length).trim();
      break;
    }
  }
  rest = rest.replace(/\s+from\s+(the\s+)?(list|cart|basket)$/i,"").trim();
  if(!rest) return null;

  var t = rest.toLowerCase();
  if(CHECKED_TARGETS.indexOf(t) !== -1) return {action:"clearChecked"};
  if(ALL_TARGETS.indexOf(t) !== -1)     return {action:"clearAll"};

  /* An ambiguous verb with nothing to remove is just an item being added. */
  if(AMBIGUOUS_VERBS.indexOf(verb) !== -1 && !findItems(rest).length) return null;

  return {action:"removeItem", target:rest};
}

/* What the command would do, as rows for the suggestion box. */
function commandEntries(cmd){
  if(cmd.action === "clearChecked"){
    var n = doneCount();
    if(!n) return [{label:"אין פריטים מסומנים", muted:true}];
    return [{
      cmd:true,
      label:"מחיקת " + (n === 1 ? "הפריט המסומן" : n + " פריטים מסומנים"),
      run: function(){ clearChecked(); }
    }];
  }

  if(cmd.action === "clearAll"){
    var t = Object.keys(state.items).length;
    if(!t) return [{label:"הרשימה כבר ריקה", muted:true}];
    return [{
      cmd:true,
      label: t === 1 ? "מחיקת הפריט האחרון" : "מחיקת כל " + t + " הפריטים",
      run: function(){ confirmClearAll(); }
    }];
  }

  var hits = findItems(cmd.target);
  if(!hits.length){
    return [{label:"“" + cmd.target + "” לא נמצא ברשימה", muted:true}];
  }
  return hits.slice(0,5).map(function(it){
    return {
      cmd:true,
      label:"מחיקת " + it.name,
      sub: it.qty ? (/^\d+(\.\d+)?$/.test(it.qty) ? "×" + it.qty : it.qty) : "",
      run: function(){ removeItemRec(it.id); }
    };
  });
}

/* A photo rides inside its item's own document, so it's shrunk to what still
   reads as a label but keeps every sync small. JPEG because Safari's canvas
   can't encode WebP and would quietly hand back a far larger PNG. */
var PHOTO_STEPS = [[720,.72],[560,.66],[420,.6],[320,.55]];
var PHOTO_MAX = 200000;   /* characters of data URL, ~150 KB */

function shrinkPhoto(file){
  return new Promise(function(resolve, reject){
    if(file.type && !/^image\//.test(file.type)){ reject(new Error("not an image")); return; }
    var url = URL.createObjectURL(file);
    var im = new Image();
    im.onload = function(){
      URL.revokeObjectURL(url);
      var w = im.naturalWidth, h = im.naturalHeight, out = "";
      for(var i=0;i<PHOTO_STEPS.length;i++){
        var k = Math.min(1, PHOTO_STEPS[i][0] / Math.max(w, h));
        var c = document.createElement("canvas");
        c.width = Math.max(1, Math.round(w * k));
        c.height = Math.max(1, Math.round(h * k));
        var ctx = c.getContext("2d");
        /* JPEG has no alpha — a transparent screenshot would turn black. */
        ctx.fillStyle = "#fff";
        ctx.fillRect(0, 0, c.width, c.height);
        ctx.imageSmoothingQuality = "high";
        ctx.drawImage(im, 0, 0, c.width, c.height);
        out = c.toDataURL("image/jpeg", PHOTO_STEPS[i][1]);
        if(out.length <= PHOTO_MAX) break;
      }
      resolve(out);
    };
    im.onerror = function(){ URL.revokeObjectURL(url); reject(new Error("decode")); };
    im.src = url;
  });
}

/* Anyone with the link can write to the list, so only inline images are
   shown — a remote URL here would be a tracking pixel. */
function isPhoto(s){
  return typeof s === "string" && /^data:image\/(jpeg|png|webp);base64,/.test(s);
}

/* ---------------------------------------------------------------- toast */

var toastTimer = null;
function flash(msg, action){
  var old = document.querySelector(".toast");
  if(old) old.remove();

  var t = el("div", action ? "toast with-action" : "toast");
  t.appendChild(el("span","msg", msg));
  if(action){
    var b = el("button","undo", action.label);
    b.type = "button";
    b.addEventListener("click", function(){
      clearTimeout(toastTimer);
      t.remove();
      action.run();
    });
    t.appendChild(b);
  }
  document.body.appendChild(t);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.remove(); }, action ? 7000 : 2600);
}

/* A removal stays undoable for as long as its toast is up. */
function offerUndo(items, msg){
  if(!items.length) return;
  flash(msg, {label:"החזר", run: function(){ restore(items); }});
}

async function restore(items){
  items.forEach(function(it){ state.items[it.id] = it; });
  render();
  if(local){ saveLocal(); }
  else {
    for(var i=0;i<items.length;i++){
      try{ await db.doc("items/" + items[i].id).set(items[i]); }
      catch(e){ handleWriteError(e); return; }
    }
  }
  flash(items.length === 1 ? "הוחזר לרשימה." : "הוחזרו " + items.length + " פריטים.");
}

/* ------------------------------------------------------------ persistence */

function saveLocal(){
  try{ localStorage.setItem(LS, JSON.stringify(state)); }
  catch(e){
    /* Photos are what fill device storage; say so rather than lose the
       change quietly on the next reload. */
    if(e && /quota/i.test(e.name || "")) flash("אין מקום במכשיר — כדאי להסיר כמה תמונות.");
  }
}
function loadLocal(){
  try{
    var raw = localStorage.getItem(LS);
    if(!raw) return;
    var d = JSON.parse(raw);
    if(d && typeof d === "object"){
      state.items   = d.items   || {};
      state.catalog = d.catalog || {};
      state.photos  = d.photos  || {};
    }
  }catch(e){}
}

function handleWriteError(e){
  var code = (e && e.code) || "";
  if(code === "permission-denied"){
    flash("הרשימה נעולה — צריך לעדכן את חוקי הגישה.");
  } else if(code === "unavailable"){
    /* Firestore queues the write and replays it once there's signal again. */
    flash("אין חיבור — השינוי יסונכרן כשתחזרו לרשת.");
  } else {
    flash("לא הצלחנו לשמור. בדקו את החיבור.");
  }
}

async function writeItem(item){
  state.items[item.id] = item;
  render();
  if(local){ saveLocal(); return; }
  try{ await db.doc("items/" + item.id).set(item); }
  catch(e){ handleWriteError(e); }
}
async function removeItemRec(id){
  var item = state.items[id];
  if(!item) return;
  delete state.items[id];
  render();
  /* Colon form sidesteps gender/number agreement with arbitrary item names. */
  offerUndo([item], "נמחק: " + item.name);
  if(local){ saveLocal(); return; }
  try{ await db.doc("items/" + id).delete(); }
  catch(e){ handleWriteError(e); }
}
async function writeCatalog(sl, entry){
  state.catalog[sl] = entry;
  if(local){ saveLocal(); return; }
  try{ await db.doc("catalog/" + sl).set(entry); }
  catch(e){ handleWriteError(e); }
}
/* A name dropped from autocomplete takes its remembered photo with it. */
async function removeCatalog(sl){
  delete state.catalog[sl];
  rememberPhoto(sl, "");
  if(local){ saveLocal(); return; }
  try{ await db.doc("catalog/" + sl).delete(); }catch(e){}
}

/* Photos are remembered by name in their own collection rather than on the
   catalog, which every device downloads whole on open — so only the photo
   for a name being added again is ever fetched. "" forgets it. */
async function rememberPhoto(sl, img){
  if(local){
    if(img) state.photos[sl] = img; else delete state.photos[sl];
    saveLocal();
    return;
  }
  try{
    if(img) await db.doc("photos/" + sl).set({img: img});
    else await db.doc("photos/" + sl).delete();
  }catch(e){ handleWriteError(e); }
}
async function recallPhoto(sl){
  if(local) return state.photos[sl] || "";
  try{
    var snap = await db.doc("photos/" + sl).get();
    var v = snap.exists ? snap.data() : null;
    return (v && isPhoto(v.img)) ? v.img : "";
  }catch(e){ return ""; }   /* offline and never fetched here: go without */
}

/* The item is already on the list by now; its photo follows once fetched,
   so adding never waits on the network. */
async function attachRemembered(id, sl){
  var img = await recallPhoto(sl);
  var cur = state.items[id];
  if(img && cur && !cur.img && slug(cur.name) === sl){
    writeItem(Object.assign({}, cur, {img: img}));
  }
}
async function deleteIds(ids){
  ids.forEach(function(id){ delete state.items[id]; });
  render();
  if(local){ saveLocal(); return; }
  for(var i=0;i<ids.length;i++){
    try{ await db.doc("items/" + ids[i]).delete(); }
    catch(e){ handleWriteError(e); break; }
  }
}

/* --------------------------------------------------------------- actions */

function addItem(rawName, presetQty){
  var parsed = parseEntry(rawName);
  if(!parsed.name) return;
  var sl = slug(parsed.name);
  var known = state.catalog[sl];

  /* Same item already on the list? Bump it rather than duplicating. */
  var existing = null;
  Object.keys(state.items).forEach(function(k){
    if(slug(state.items[k].name) === sl) existing = state.items[k];
  });
  if(existing){
    var next = Object.assign({}, existing, {
      qty: String(multiplier(existing.qty) + multiplier(presetQty || parsed.qty || "1")),
      done: false
    });
    writeItem(next);
    flash("כבר ברשימה — עכשיו " + next.qty + ".");
    return;
  }

  var cat = (known && known.cat) || guessCat(parsed.name);
  var item = {
    id: uid(),
    name: known ? known.name : parsed.name,
    qty: presetQty || parsed.qty || "",
    cat: cat,
    addedBy: myName || "",
    done: false,
    ts: Date.now()
  };
  writeItem(item);

  /* Remember the name so it autocompletes next time — or, if it's been
     added before, bring back the photo it had. */
  if(!known) writeCatalog(sl, {name: parsed.name, cat: cat});
  else attachRemembered(item.id, sl);

  /* Say where it landed, with one tap to move it if the guess was wrong. */
  flash(catIcon(cat) + " נוסף ל" + catLabel(cat), {
    label: "עריכה",
    run: function(){ openEditItem(state.items[item.id] || item); }
  });
}

function toggleDone(id){
  var it = state.items[id];
  if(!it) return;
  writeItem(Object.assign({}, it, {done: !it.done}));
}

function clearChecked(){
  var done = Object.keys(state.items).filter(function(k){ return state.items[k].done; });
  if(!done.length){ flash("עוד לא סימנתם כלום."); return; }
  var removed = done.map(function(k){ return state.items[k]; });
  deleteIds(done);
  offerUndo(removed, removed.length === 1
    ? "נמחק פריט אחד."
    : "נמחקו " + removed.length + " פריטים.");
}

/* Renaming a mistyped item also drops the typo from autocomplete.
   photo: undefined leaves it alone, "" removes it, a data URL replaces it. */
function renameItem(id, newName, newQty, cat, photo){
  var cur = state.items[id];
  if(!cur){ flash("הפריט כבר לא ברשימה."); return; }

  var oldSlug = slug(cur.name), newSlug = slug(newName);

  /* Fixing a typo onto a name that's already listed merges the two rather
     than leaving a duplicate behind. */
  var twin = null;
  Object.keys(state.items).forEach(function(k){
    if(k !== id && slug(state.items[k].name) === newSlug) twin = state.items[k];
  });
  if(twin){
    var merged = Object.assign({}, twin, {
      name: newName,
      qty: String(multiplier(twin.qty) + multiplier(newQty || "1")),
      cat: cat,
      done: false
    });
    /* The photo you were editing wins; otherwise the twin keeps its own. */
    var mine = (photo === undefined) ? cur.img : photo;
    if(mine) merged.img = mine;
    writeItem(merged);
    if(mine && mine !== twin.img) rememberPhoto(newSlug, mine);
    deleteIds([id]);
    flash("אוחד עם " + newName + ".");
    return;
  }

  var next = Object.assign({}, cur, {name:newName, qty:newQty, cat:cat});
  if(photo === "") delete next.img;
  else if(photo) next.img = photo;
  writeItem(next);

  /* The photo belongs to the name too: a new one is remembered, a removed
     one forgotten, and a rename carries it over — or picks up the photo the
     new name already had. */
  if(photo !== undefined) rememberPhoto(newSlug, photo);
  else if(newSlug !== oldSlug){
    if(next.img) rememberPhoto(newSlug, next.img);
    else attachRemembered(id, newSlug);
  }

  if(newSlug !== oldSlug){
    var stillUsed = Object.keys(state.items).some(function(k){
      return slug(state.items[k].name) === oldSlug;
    });
    if(!stillUsed && state.catalog[oldSlug]) removeCatalog(oldSlug);
  }
  writeCatalog(newSlug, {name:newName, cat:cat});
}

/* ---------------------------------------------------------------- render */

function render(){
  renderProgress();
  renderList();
  renderDock();
  paintPeople();
}

function renderProgress(){
  var total = Object.keys(state.items).length;
  var got = doneCount();
  var wrap = document.getElementById("progress");

  /* Only worth showing once a run is under way. */
  wrap.hidden = !got;
  if(!got) return;

  document.getElementById("pbar-fill").style.width =
    Math.round(got / total * 100) + "%";
  document.getElementById("ptext").textContent =
    "בעגלה " + got + " מתוך " + total;
}

function renderList(){
  var body = document.getElementById("list-body");
  body.textContent = "";
  var items = sortedItems();

  if(!items.length){ body.appendChild(emptyState()); return; }

  groupByAisle(items).forEach(function(g){
    /* unchecked first inside each aisle, so what's left floats to the top */
    var ordered = g.items.slice().sort(function(a,b){ return (a.done?1:0) - (b.done?1:0); });
    var left = g.items.filter(function(i){ return !i.done; }).length;
    body.appendChild(aisleHead(g, left));
    ordered.forEach(function(it){ body.appendChild(itemRow(it)); });
  });

  if(doneCount() === items.length){
    var done = el("div","donenote");
    done.appendChild(el("div","cheer","✅"));
    done.appendChild(el("div","big","זהו, הכל נאסף."));
    done.appendChild(el("p",null,"אפשר לנקות את העגלה מלמטה."));
    body.appendChild(done);
  }
}

function aisleHead(g, left){
  var h = el("div","aisle");
  var head = el("div","aisle-head");
  var ico = el("span","ico", g.icon);
  ico.setAttribute("aria-hidden","true");
  head.appendChild(ico);
  var h2 = el("h2",null,g.name);
  h2.setAttribute("dir","auto");
  head.appendChild(h2);
  head.appendChild(el("span","count num", String(left)));
  h.appendChild(head);
  return h;
}

function itemRow(it){
  var row = el("div","row");
  row.dataset.done = it.done ? "1" : "0";

  var check = el("button","check");
  check.type = "button";
  check.setAttribute("aria-pressed", it.done ? "true" : "false");
  check.setAttribute("aria-label", (it.done ? "ביטול סימון " : "סימון ") + it.name);
  check.appendChild(svg(["M4.5 12.5l5 5 10-11"], "3"));
  check.addEventListener("click", function(){ toggleDone(it.id); });
  row.appendChild(check);

  var main = el("button","r-main");
  main.type = "button";
  var nm = el("div","r-name", it.name);
  nm.setAttribute("dir","auto");
  main.appendChild(nm);

  var sub = el("div","r-sub");
  if(it.qty) sub.appendChild(el("span","qty", it.qty));
  if(it.addedBy){
    var dot = el("span","person");
    dot.style.width = "16px"; dot.style.height = "16px"; dot.style.fontSize = "8px";
    dot.dataset.who = it.addedBy;
    sub.appendChild(dot);
  }
  if(sub.childNodes.length) main.appendChild(sub);

  main.addEventListener("click", function(){ toggleDone(it.id); });
  row.appendChild(main);

  if(isPhoto(it.img)){
    var thumb = el("button","r-thumb");
    thumb.type = "button";
    thumb.setAttribute("aria-label","תמונה של " + it.name);
    var ti = el("img");
    ti.src = it.img; ti.alt = "";
    thumb.appendChild(ti);
    thumb.addEventListener("click", function(){ openPhoto(it); });
    row.appendChild(thumb);
  }

  var more = el("button","r-more");
  more.type = "button";
  more.setAttribute("aria-label","עריכת " + it.name);
  more.appendChild(svg(["M12 5.4h.01","M12 12h.01","M12 18.6h.01"], "2.6"));
  more.addEventListener("click", function(ev){
    ev.stopPropagation();
    openEditItem(it);
  });
  row.appendChild(more);

  return row;
}

function openEditItem(it){
  var chosenCat = it.cat || "other";
  var catTouched = false;

  openSheet(function(sheet){
    sheetHead(sheet, "עריכת פריט");

    var f1 = el("div","field");
    var l1 = el("label",null,"שם");
    l1.setAttribute("for","edit-name");
    var i1 = el("input");
    i1.type = "text"; i1.id = "edit-name"; i1.name = "edit-name";
    i1.value = it.name;
    i1.setAttribute("dir","auto");
    i1.setAttribute("autocomplete","off");
    f1.appendChild(l1); f1.appendChild(i1);
    sheet.appendChild(f1);

    var f2 = el("div","field narrow");
    var l2 = el("label",null,"כמות");
    l2.setAttribute("for","edit-qty");
    var i2 = el("input");
    i2.type = "text"; i2.id = "edit-qty"; i2.name = "edit-qty";
    i2.value = it.qty || "";
    i2.placeholder = "2";
    i2.setAttribute("dir","auto");
    f2.appendChild(l2); f2.appendChild(i2);
    sheet.appendChild(f2);

    /* Optional photo, for when the exact brand or pack matters. Staged like
       the other fields and only written on save. */
    var photo, photoBusy = false;   /* photo: undefined untouched, "" removed */
    var f4 = el("div","field");
    f4.appendChild(el("label",null,"תמונה"));
    var pickWrap = el("div","imgpick");
    f4.appendChild(pickWrap);
    var file = el("input");
    file.type = "file"; file.name = "edit-photo"; file.accept = "image/*";
    file.hidden = true;
    f4.appendChild(file);
    var photoNote = el("div","sublabel","נשמרת לפי השם וחוזרת בפעם הבאה שתוסיפו את הפריט.");
    photoNote.style.margin = "2px 0 0";
    f4.appendChild(photoNote);
    sheet.appendChild(f4);

    var paintPhoto = function(){
      pickWrap.textContent = "";
      var src = (photo === undefined) ? it.img : photo;
      if(isPhoto(src)){
        var im = el("img","imgprev");
        im.src = src; im.alt = "";
        pickWrap.appendChild(im);
      } else src = "";

      var btns = el("div","imgbtns");
      var pick = el("button","imgbtn");
      pick.type = "button";
      pick.disabled = photoBusy;
      pick.appendChild(svg(CAMERA,"1.8"));
      pick.appendChild(document.createTextNode(
        photoBusy ? "התמונה בעיבוד…" : (src ? "החלפה" : "הוספת תמונה")));
      pick.addEventListener("click", function(){ file.click(); });
      btns.appendChild(pick);
      if(src && !photoBusy){
        var drop = el("button","imgbtn","הסרה");
        drop.type = "button";
        drop.addEventListener("click", function(){ photo = ""; paintPhoto(); });
        btns.appendChild(drop);
      }
      pickWrap.appendChild(btns);
    };
    file.addEventListener("change", function(){
      var f = file.files && file.files[0];
      file.value = "";   /* so picking the same file again still fires */
      if(!f) return;
      photoBusy = true;
      paintPhoto();
      shrinkPhoto(f).then(
        function(src){ photo = src; },
        function(){ flash("לא הצלחנו לקרוא את התמונה."); }
      ).then(function(){ photoBusy = false; paintPhoto(); });
    });
    paintPhoto();

    var f3 = el("div","field");
    f3.appendChild(el("label",null,"מדף"));
    var picks = el("div","apicks");
    CATS.forEach(function(c){
      var b = el("button","apick");
      b.type = "button";
      var ico = el("span",null,c[2]);
      ico.setAttribute("aria-hidden","true");
      b.appendChild(ico);
      var lbl = el("span",null,c[1]);
      lbl.setAttribute("dir","auto");
      b.appendChild(lbl);
      b.dataset.sel = (c[0] === chosenCat) ? "1" : "0";
      b.addEventListener("click", function(){
        chosenCat = c[0];
        catTouched = true;
        Array.prototype.forEach.call(picks.children, function(x){ x.dataset.sel = "0"; });
        b.dataset.sel = "1";
      });
      picks.appendChild(b);
    });
    f3.appendChild(picks);
    sheet.appendChild(f3);

    var save = function(){
      if(photoBusy){ flash("רגע, התמונה עוד בעיבוד."); return; }
      var newName = i1.value.trim();
      if(!newName){ flash("צריך לתת שם לפריט."); i1.focus(); return; }
      var renamed = newName !== it.name;
      /* A fixed typo should land in the right aisle unless you picked one. */
      var cat = catTouched ? chosenCat : (renamed ? guessCat(newName) : (it.cat || "other"));
      closeSheet();
      renameItem(it.id, newName, i2.value.trim(), cat, photo);
    };
    var onEnter = function(e){ if(e.key === "Enter"){ e.preventDefault(); save(); } };
    i1.addEventListener("keydown", onEnter);
    i2.addEventListener("keydown", onEnter);

    var row = el("div","sheet-row");
    var cancel = el("button","btn btn-ghost","ביטול");
    cancel.type = "button";
    cancel.addEventListener("click", closeSheet);
    var go = el("button","btn btn-primary","שמירה");
    go.type = "button";
    go.addEventListener("click", save);
    row.appendChild(cancel); row.appendChild(go);
    sheet.appendChild(row);

    var del = el("button","linkbtn danger","מחיקת הפריט");
    del.type = "button";
    del.addEventListener("click", function(){
      closeSheet();
      removeItemRec(it.id);
    });
    sheet.appendChild(del);

    setTimeout(function(){ i1.focus(); i1.select(); }, 30);
  }, "עריכת פריט");
}

function openPhoto(it){
  openSheet(function(sheet){
    sheetHead(sheet, it.name);
    var im = el("img","viewer");
    im.src = it.img; im.alt = it.name;
    sheet.appendChild(im);

    var edit = el("button","linkbtn","עריכת הפריט");
    edit.type = "button";
    edit.addEventListener("click", function(){ openEditItem(state.items[it.id] || it); });
    sheet.appendChild(edit);
  }, "תמונה של " + it.name);
}

  var e = el("div","empty");
  e.appendChild(el("h2",null,"הרשימה ריקה."));
  e.appendChild(el("p",null,"אפשר להוסיף פריטים למעלה — כל מה שאחד מכם מוסיף מופיע מיד אצל השני. בסופר מקישים על פריט כדי להכניס אותו לעגלה, ומה שעוד חסר נשאר למעלה בכל מדף."));

  hint.appendChild(document.createTextNode(" או "));

/* The dock carries one action, and only once there's something to clear. */
function renderDock(){
  var dock = document.getElementById("dock");
  var got = doneCount();
  dock.hidden = !got;
  dock.textContent = "";
  if(!got) return;

  var fin = el("button","btn btn-primary");
  fin.type = "button";
  fin.appendChild(document.createTextNode("ניקוי העגלה"));
  fin.appendChild(el("span","n num", String(got)));
  fin.addEventListener("click", function(){ clearChecked(); });
  dock.appendChild(fin);
}

/* A stable colour per name, so you two are consistently different. */
function colorFor(name){
  var h = 0;
  for(var i=0;i<name.length;i++) h = (h * 31 + name.charCodeAt(i)) % 360;
  return "hsl(" + h + " 42% 40%)";
}

/* Names are typed by people — always set via textContent. */
function paintPeople(){
  var distinct = {};
  sortedItems().forEach(function(i){ if(i.addedBy) distinct[i.addedBy] = 1; });
  var many = Object.keys(distinct).length > 1;

  Array.prototype.forEach.call(document.querySelectorAll("[data-who]"), function(n){
    var who = n.dataset.who;
    if(n.id !== "me-chip") n.hidden = !(many && who);
    if(!who) return;
    n.textContent = who.trim().charAt(0) || "?";
    n.style.background = colorFor(who);
    n.title = (who === myName) ? who + " (את/ה)" : who;
  });
}

function setMyName(name){
  myName = String(name || "").trim().slice(0, 24);
  try{ localStorage.setItem(LS_NAME, myName); }catch(e){}
  var chip = document.getElementById("me-chip");
  chip.hidden = !myName;
  chip.dataset.who = myName;
  render();
}

/* -------------------------------------------------------------- suggest */

/* Names you've added before, for plain-text autocomplete. */
function catalogEntries(raw){
  var query = raw.toLowerCase();
  var onList = {};
  Object.keys(state.items).forEach(function(k){ onList[slug(state.items[k].name)] = 1; });

  return Object.keys(state.catalog)
    .map(function(k){ return state.catalog[k]; })
    .filter(function(c){
      return c && c.name && !onList[slug(c.name)] &&
             c.name.toLowerCase().indexOf(query) !== -1;
    })
    .slice(0,5)
    .map(function(c){
      return {label:c.name, sub:catIcon(c.cat), run:function(){ addItem(c.name); }};
    });
}

function closeSuggest(){
  document.getElementById("suggest").hidden = true;
  suggestList = []; suggestIdx = -1;
}

function renderSuggest(q){
  var box = document.getElementById("suggest");
  box.textContent = "";
  suggestList = [];
  suggestIdx = -1;

  var raw = String(q).trim();
  if(!raw){ box.hidden = true; return; }

  var cmd = parseCommand(raw);
  var entries = cmd ? commandEntries(cmd) : catalogEntries(raw);
  if(!entries.length){ box.hidden = true; return; }
  suggestList = entries;

  entries.forEach(function(e, i){
    var b = el("button");
    b.type = "button";
    b.dataset.i = String(i);
    if(e.cmd) b.className = "s-cmd";
    if(e.muted) b.disabled = true;
    var n = el("span","s-name", e.label);
    n.setAttribute("dir","auto");
    b.appendChild(n);
    if(e.sub) b.appendChild(el("span","s-sub", e.sub));
    b.addEventListener("click", function(){
      if(e.muted) return;
      e.run();
      document.getElementById("add-input").value = "";
      closeSuggest();
    });
    box.appendChild(b);
  });
  box.hidden = false;
}

function moveSuggest(d){
  var box = document.getElementById("suggest");
  if(box.hidden || !suggestList.length) return false;
  var usable = suggestList.filter(function(x){ return !x.muted; }).length;
  if(!usable) return false;
  var i = (suggestIdx === -1 && d === -1) ? 0 : suggestIdx;
  do { i = (i + d + suggestList.length) % suggestList.length; }
  while(suggestList[i].muted);
  suggestIdx = i;
  Array.prototype.forEach.call(box.children, function(c, k){
    c.dataset.active = (k === suggestIdx) ? "1" : "0";
  });
  return true;
}

/* ----------------------------------------------------------------- wire */

document.getElementById("add-form").addEventListener("submit", function(e){
  e.preventDefault();
  var input = document.getElementById("add-input");
  var raw = input.value.trim();
  if(!raw) return;

  var picked = (suggestIdx >= 0) ? suggestList[suggestIdx] : null;
  if(picked && !picked.muted){
    picked.run();
  } else {
    var cmd = parseCommand(raw);
    if(cmd){
      var entries = commandEntries(cmd);
      var live = entries.filter(function(x){ return !x.muted; });
      if(live.length === 1){
        live[0].run();
      } else if(!live.length){
        /* Keep what they typed so a typo is one edit away from working. */
        flash(entries[0] ? entries[0].label : "לא נמצא");
        return;
      } else {
        flash("יש כמה כאלה — בחרו אחד");
        return;
      }
    } else {
      addItem(raw);
    }
  }
  input.value = "";
  closeSuggest();
  input.focus();
});

document.getElementById("add-input").addEventListener("input", function(e){
  renderSuggest(e.target.value);
});
document.getElementById("add-input").addEventListener("keydown", function(e){
  if(e.key === "ArrowDown"){ if(moveSuggest(1)) e.preventDefault(); }
  else if(e.key === "ArrowUp"){ if(moveSuggest(-1)) e.preventDefault(); }
  else if(e.key === "Escape"){ closeSuggest(); }
});
document.addEventListener("click", function(e){
  var box = document.getElementById("suggest");
  if(!box.hidden && !e.target.closest(".addwrap")) closeSuggest();
});
document.getElementById("btn-settings").addEventListener("click", openSettings);
document.getElementById("veil").addEventListener("click", function(e){
  if(e.target.id === "veil") closeSheet();
});
document.addEventListener("keydown", function(e){
  if(e.key === "Escape" && !document.getElementById("veil").hidden) closeSheet();
});

/* ----------------------------------------------------------------- boot */

function banner(text){
  var slot = document.getElementById("banner-slot");
  slot.textContent = "";
  slot.appendChild(el("div","banner", text));
}

if("serviceWorker" in navigator){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  });
}

try{ myName = localStorage.getItem(LS_NAME) || ""; }catch(e){}
loadLocal();
if(myName){
  var meChip = document.getElementById("me-chip");
  meChip.hidden = false;
  meChip.dataset.who = myName;
}
render();

(function(){
  if(typeof firebase === "undefined" || !firebase.firestore){
    banner("לא הצלחנו לטעון את שירות הסנכרון — המכשיר הזה עובד על עותק מקומי.");
    return;
  }

  var fs;
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    fs = firebase.firestore();
  }catch(e){
    banner("אין חיבור לרשימה המשותפת — עובדים על המכשיר הזה בלבד.");
    return;
  }

  /* Keeps the list usable in a shop with no signal; writes replay on
     reconnect. Harmless if the browser or another tab refuses it. */
  if(typeof fs.enablePersistence === "function"){
    try{
      var p = fs.enablePersistence({synchronizeTabs:true});
      if(p && p.catch) p.catch(function(){});
    }catch(e){}
  }

  /* One shared list, addressed the way the rest of the code already expects:
     db.collection("items") and db.doc("items/<id>"). */
  var base = fs.collection("lists").doc(LIST_ID);
  db = {
    collection: function(name){ return base.collection(name); },
    doc: function(path){
      var parts = path.split("/");
      return base.collection(parts[0]).doc(parts.slice(1).join("/"));
    }
  };
  local = false;

  var onErr = function(e){
    banner(((e && e.code) === "permission-denied")
      ? "הרשימה נעולה — צריך לעדכן את חוקי הגישה ב-Firebase."
      : "החיבור לרשימה המשותפת נותק. הוא יתחבר מחדש בעצמו.");
  };

  db.collection("items").onSnapshot(function(snap){
    var next = {};
    snap.docs.forEach(function(doc){
      var v = doc.data() || {};
      var item = {
        id: doc.id,
        name: String(v.name || ""),
        qty: String(v.qty || ""),
        cat: String(v.cat || "other"),
        addedBy: String(v.addedBy || ""),
        done: !!v.done,
        ts: Number(v.ts) || 0
      };
      /* Left off entirely when absent, so items without one don't grow an
         empty field the next time they're written. */
      if(isPhoto(v.img)) item.img = v.img;
      next[doc.id] = item;
    });
    state.items = next;
    render();
  }, onErr);

  db.collection("catalog").onSnapshot(function(snap){
    var next = {};
    snap.docs.forEach(function(doc){
      var v = doc.data() || {};
      next[doc.id] = {name:String(v.name || doc.id), cat:String(v.cat || "other")};
    });
    state.catalog = next;
    render();
  }, onErr);
})();

})();
</script>
