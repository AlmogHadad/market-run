<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Market Run</title>
<meta name="description" content="רשימת קניות משותפת לשניים.">
<!-- The list is reachable by anyone holding the link; keep it out of search. -->
<meta name="robots" content="noindex, nofollow">

<meta name="theme-color" content="#F3F4EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12140F" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<!-- Safari ignores SVG here, so the home-screen icon has to be a PNG. -->
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Market Run">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Heebo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

<style>
/* Baseline the page depends on. [hidden] must beat display:flex — the dock,
   progress bar and sheets are all flex containers toggled by that attribute. */
*{box-sizing:border-box}
html,body{margin:0;padding:0}
img{max-width:100%}
[hidden]{display:none!important}

:root{
  color-scheme: light;
  --ground:#F3F4EF;
  --surface:#FFFFFF;
  --surface-2:#EAECE4;
  --ink:#191C16;
  --ink-muted:#5E6357;
  --ink-faint:#8E9385;
  --line:#DDE0D6;
  --line-strong:#C3C8B8;
  --accent:#2E6B4A;
  --accent-ink:#FFFFFF;
  --accent-soft:#E2EFE7;
  --danger:#9B3220;
  --urgent:#B8471F;
  --urgent-soft:#F8E6DC;
  --shadow:0 1px 2px rgba(25,28,22,.06), 0 8px 24px rgba(25,28,22,.06);
  --dock-shadow:0 -1px 0 var(--line), 0 -10px 24px rgba(25,28,22,.05);

  /* Heebo carries the Hebrew; Bricolage is kept only for the Latin wordmark. */
  --display:"Heebo","Bricolage Grotesque",system-ui,sans-serif;
  --brand:"Bricolage Grotesque","Heebo",system-ui,sans-serif;
  --body:"Heebo",system-ui,-apple-system,Segoe UI,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --ground:#12140F;
    --surface:#1B1E17;
    --surface-2:#23271E;
    --ink:#E9EBE1;
    --ink-muted:#A0A594;
    --ink-faint:#767B6B;
    --line:#2C3126;
    --line-strong:#3C4234;
    --accent:#6FBE8E;
    --accent-ink:#0F2218;
    --accent-soft:#1E2E24;
    --danger:#E0715A;
    --urgent:#F08A5D;
    --urgent-soft:#3A241A;
    --shadow:0 1px 2px rgba(0,0,0,.45), 0 8px 24px rgba(0,0,0,.35);
    --dock-shadow:0 -1px 0 var(--line), 0 -10px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --ground:#12140F;
  --surface:#1B1E17;
  --surface-2:#23271E;
  --ink:#E9EBE1;
  --ink-muted:#A0A594;
  --ink-faint:#767B6B;
  --line:#2C3126;
  --line-strong:#3C4234;
  --accent:#6FBE8E;
  --accent-ink:#0F2218;
  --accent-soft:#1E2E24;
  --danger:#E0715A;
  --urgent:#F08A5D;
  --urgent-soft:#3A241A;
  --shadow:0 1px 2px rgba(0,0,0,.45), 0 8px 24px rgba(0,0,0,.35);
  --dock-shadow:0 -1px 0 var(--line), 0 -10px 24px rgba(0,0,0,.35);
}

body{
  background:var(--ground);
  color:var(--ink);
  font-family:var(--body);
  font-size:16px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{margin:0;text-wrap:balance}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}
/* Digits stay left-to-right inside RTL text. */
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}

.app{max-width:600px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;background:var(--ground)}

/* ---------- header ---------- */
.topbar{
  position:sticky;top:0;z-index:20;
  display:flex;align-items:center;gap:12px;
  padding:14px 18px 12px;
  background:var(--ground);
  border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:9px;margin-inline-end:auto;min-width:0}
.brand svg{width:21px;height:21px;color:var(--accent);flex:none}
.brand h1{
  font-family:var(--brand);font-weight:800;font-size:20px;letter-spacing:-.02em;
  white-space:nowrap;direction:ltr;
}
.icon-btn{
  width:38px;height:38px;display:grid;place-items:center;border-radius:9px;color:var(--ink-muted);
}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.icon-btn svg{width:20px;height:20px}

.person{
  width:26px;height:26px;border-radius:50%;flex:none;
  display:grid;place-items:center;
  font-size:11px;font-weight:700;
  color:#fff;background:var(--ink-faint);
  user-select:none;
}

/* ---------- scroll area ---------- */
/* Bottom padding keeps the last row clear of the floating Netlify badge. */
.scroll{flex:1;padding:0 18px calc(76px + env(safe-area-inset-bottom))}

/* ---------- add bar ---------- */
.addwrap{position:relative;padding-top:16px}
.addbar{display:flex;gap:8px}
.addbar input{
  flex:1;min-width:0;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:11px;
  padding:13px 14px;
  box-shadow:var(--shadow);
}
.addbar input::placeholder{color:var(--ink-faint)}
.addbar input:focus{border-color:var(--accent);outline:none}
.addbar button{
  background:var(--accent);color:var(--accent-ink);
  border-radius:11px;padding:0 20px;font-weight:600;
  box-shadow:var(--shadow);
}
.addbar button:hover{filter:brightness(1.06)}

.suggest{
  position:absolute;inset-inline:0;top:calc(100% + 6px);z-index:15;
  background:var(--surface);border:1px solid var(--line);border-radius:11px;
  box-shadow:var(--shadow);overflow:hidden;
}
.suggest button{
  display:flex;width:100%;align-items:center;gap:10px;
  padding:12px 14px;text-align:start;border-bottom:1px solid var(--line);
}
.suggest button:last-child{border-bottom:none}
.suggest button:hover,.suggest button[data-active="1"]{background:var(--accent-soft)}
.suggest .s-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.suggest .s-sub{font-size:13px;color:var(--ink-muted)}
.suggest button.s-cmd .s-name{color:var(--accent);font-weight:600}
.suggest button:disabled{color:var(--ink-faint);cursor:default;background:none}
.suggest button:disabled:hover{background:none}

/* ---------- progress ---------- */
.progress{margin-top:18px;display:flex;align-items:center;gap:12px}
.pbar{flex:1;height:4px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .25s ease}
.ptext{flex:none;font-size:12px;color:var(--ink-faint)}

/* ---------- list ---------- */
.aisle{margin-top:22px}
.aisle-head{
  display:flex;align-items:center;gap:8px;
  padding:0 2px 7px;border-bottom:1px solid var(--line-strong);
}
.aisle-head .ico{font-size:15px;line-height:1;flex:none;width:19px;text-align:center}
.aisle-head h2{
  font-family:var(--display);font-weight:700;font-size:13.5px;
  color:var(--ink-muted);
}
.aisle-head .count{font-size:11.5px;color:var(--ink-faint);margin-inline-start:auto}

.row{
  display:flex;align-items:center;gap:12px;
  padding:14px 2px;
  border-bottom:1px solid var(--line);
}
.row[data-done="1"] .r-name{text-decoration:line-through;color:var(--ink-faint)}
.row[data-done="1"]{opacity:.6}

.check{
  width:30px;height:30px;flex:none;border-radius:50%;
  border:1.75px solid var(--line-strong);background:var(--surface);
  display:grid;place-items:center;
}
.check svg{width:16px;height:16px;color:var(--accent-ink);opacity:0;stroke-width:3}
.row[data-done="1"] .check{background:var(--accent);border-color:var(--accent)}
.row[data-done="1"] .check svg{opacity:1}

.r-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;text-align:start}
.r-name{font-weight:500;overflow-wrap:anywhere}
.r-sub{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-faint)}
.qty{
  font-family:var(--mono);font-size:11.5px;font-weight:500;
  background:var(--surface-2);color:var(--ink-muted);
  padding:1px 6px;border-radius:3px;direction:ltr;unicode-bidi:isolate;
}
.r-more{
  width:34px;height:34px;flex:none;display:grid;place-items:center;
  border-radius:8px;color:var(--ink-faint);
}
.r-more:hover{background:var(--surface-2);color:var(--ink)}
.r-more svg{width:18px;height:18px}
/* Photo attached to an item — a tap opens it full size. */
.r-thumb{
  width:40px;height:40px;flex:none;padding:0;overflow:hidden;
  border-radius:8px;border:1px solid var(--line);background:var(--surface-2);
}
.r-thumb:hover{border-color:var(--line-strong)}
.r-thumb img{display:block;width:100%;height:100%;object-fit:cover}

/* Urgent: its own section at the top, a tag on the row. */
/* Urgent: tinted in place, with a bar on the start edge. */
.row[data-urgent="1"]{
  background:var(--urgent-soft);
  box-shadow:inset -3px 0 0 var(--urgent);
  margin-inline:-8px;padding-inline:10px 2px;border-radius:4px;
}
.row[data-urgent="1"] .r-name{font-weight:700}
.row[data-urgent="1"][data-done="1"]{background:none;box-shadow:none}
.r-urgent{
  width:34px;height:34px;flex:none;display:grid;place-items:center;
  border-radius:8px;color:var(--ink-faint);opacity:.7;
}
.r-urgent:hover{background:var(--surface-2);color:var(--urgent)}
.r-urgent svg{width:18px;height:18px}
.r-urgent[aria-pressed="true"]{color:#fff;background:var(--urgent);opacity:1}
.r-urgent[aria-pressed="true"]:hover{color:#fff;filter:brightness(1.08)}

/* ---------- packs ---------- */
.packs{display:flex;gap:7px;overflow-x:auto;padding:12px 0 2px;scrollbar-width:none}
.packs::-webkit-scrollbar{display:none}
.pack{
  flex:none;display:flex;align-items:center;gap:6px;
  border:1px solid var(--line-strong);border-radius:999px;background:var(--surface);
  padding:7px 13px;font-size:14px;font-weight:500;color:var(--ink-muted);white-space:nowrap;
}
.pack:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.pack .n{font-family:var(--mono);font-size:11.5px;color:var(--ink-faint)}
.pack.edit{border-style:dashed;color:var(--ink-faint)}
.packlist{display:flex;flex-direction:column;margin-bottom:6px}
.packrow{
  display:flex;align-items:center;gap:10px;padding:12px 2px;
  border-bottom:1px solid var(--line);text-align:start;width:100%;
}
.packrow .pr-main{flex:1;min-width:0}
.packrow .pr-name{font-weight:600}
.packrow .pr-items{font-size:13px;color:var(--ink-faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.field textarea{
  background:var(--surface);border:1px solid var(--line);border-radius:11px;
  padding:14px;font:inherit;font-size:16px;width:100%;min-height:150px;resize:vertical;line-height:1.6;
}
.field textarea:focus{border-color:var(--accent);outline:none}

/* On/off switch in the edit sheet. */
.toggle{
  display:flex;align-items:center;gap:12px;width:100%;text-align:start;
  border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:12px 14px;
}
.toggle .t-main{flex:1}
.toggle .t-sub{display:block;font-size:12.5px;color:var(--ink-faint)}
.toggle .knob{width:40px;height:24px;border-radius:999px;background:var(--line-strong);position:relative;flex:none;transition:background .15s}
.toggle .knob::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:inset-inline-start .15s}
.toggle[aria-pressed="true"]{border-color:var(--urgent);background:var(--urgent-soft)}
.toggle[aria-pressed="true"] .knob{background:var(--urgent)}
.toggle[aria-pressed="true"] .knob::after{inset-inline-start:19px}

/* ---------- prices ---------- */
.icon-btn.shekel{font-size:19px;font-weight:700;font-family:var(--body)}
.totals{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:6px}
.total{
  background:var(--surface);border:1px solid var(--line);border-radius:12px;
  padding:10px 8px;text-align:center;min-width:0;
}
.total .t-chain{font-size:12.5px;color:var(--ink-muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.total .t-sum{font-family:var(--mono);font-size:17px;font-weight:600;margin-top:2px;direction:ltr}
.total .t-diff{font-size:11.5px;color:var(--ink-faint);margin-top:1px;direction:ltr}
.total[data-best="1"]{border-color:var(--accent);background:var(--accent-soft)}
.total[data-best="1"] .t-sum,.total[data-best="1"] .t-chain{color:var(--accent)}
.pgrid{display:grid;grid-template-columns:minmax(0,1fr) repeat(3,58px);align-items:center;column-gap:6px}
.phead{font-size:11.5px;color:var(--ink-faint);font-weight:700;padding:14px 2px 6px;border-bottom:1px solid var(--line-strong)}
.phead span{text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow{width:100%;text-align:start;padding:10px 2px;border-bottom:1px solid var(--line)}
.prow:hover{background:var(--surface-2)}
.prow .p-name{font-weight:500;overflow-wrap:anywhere}
.prow .p-match{font-size:11.5px;color:var(--ink-faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .p-match b{font-weight:600;color:var(--accent)}
.prow .p-match.none{color:var(--danger)}
.pp{font-family:var(--mono);font-size:13px;text-align:center;direction:ltr;color:var(--ink-muted)}
.pp[data-best="1"]{color:var(--accent);font-weight:700}
.pp[data-approx="1"]::after{content:"≈";color:var(--ink-faint);font-size:10px;margin-inline-start:1px}
.pp small{display:block;font-size:9.5px;color:var(--ink-faint);font-family:var(--body)}
.pnote{font-size:12.5px;color:var(--ink-faint);margin:10px 0 0;line-height:1.55}
.loading{padding:28px 0;text-align:center;color:var(--ink-faint);font-size:14px}
.picker-res{display:flex;flex-direction:column;margin-top:4px}
.pick{width:100%;text-align:start;padding:11px 2px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.pick:hover{background:var(--surface-2)}
.pick[data-sel="1"]{background:var(--accent-soft)}
.pick .k-name{font-weight:500}
.pick .k-size{font-size:12px;color:var(--ink-faint);margin-inline-start:6px;font-weight:400}
.pick .k-prices{display:flex;flex-wrap:wrap;gap:5px}
.pick .k-p{font-size:11.5px;background:var(--surface-2);color:var(--ink-muted);padding:1px 7px;border-radius:999px}
.pick .k-p.miss{opacity:.5}
.field select{
  background:var(--surface);border:1px solid var(--line);border-radius:11px;
  padding:12px;font:inherit;font-size:16px;width:100%;color:var(--ink);
}
.linkfield{
  display:flex;align-items:center;gap:10px;width:100%;text-align:start;
  border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:12px 14px;
}
.linkfield .lf-main{flex:1;min-width:0}
.linkfield .lf-sub{display:block;font-size:12.5px;color:var(--ink-faint)}
.linkfield .lf-go{color:var(--accent);font-weight:600;font-size:14px;flex:none}

/* ---------- empty / done ---------- */
.empty{
  margin-top:26px;background:var(--surface);border:1px solid var(--line);
  border-radius:14px;padding:22px 20px;box-shadow:var(--shadow);
}
.empty h2{font-family:var(--display);font-weight:700;font-size:18px}
.empty p{margin:7px 0 0;color:var(--ink-muted);font-size:14.5px;max-width:48ch}
.empty .hint{margin-top:13px;font-size:13px;color:var(--ink-faint)}
.kbd{
  font-size:12.5px;
  background:var(--surface-2);color:var(--ink-muted);
  padding:1px 6px;border-radius:4px;white-space:nowrap;
  unicode-bidi:isolate;
}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:16px}
.chip{
  display:flex;align-items:center;gap:6px;
  border:1px solid var(--line-strong);border-radius:999px;
  padding:7px 13px;font-size:14px;font-weight:500;color:var(--ink-muted);
  background:var(--ground);
}
.chip:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}

.donenote{margin-top:24px;text-align:center;padding:22px 16px;color:var(--ink-muted)}
.donenote .cheer{font-size:26px;line-height:1;margin-bottom:8px}
.donenote .big{font-family:var(--display);font-weight:700;font-size:17px;color:var(--ink)}
.donenote p{margin:5px 0 0;font-size:13.5px}

/* ---------- dock ---------- */
.dock{
  position:sticky;bottom:0;z-index:20;
  padding:12px 18px calc(12px + env(safe-area-inset-bottom));
  background:var(--ground);box-shadow:var(--dock-shadow);
  display:flex;gap:10px;
}
.btn{
  flex:1;border-radius:12px;padding:15px 18px;
  font-weight:600;font-size:15.5px;
  display:flex;align-items:center;justify-content:center;gap:9px;
}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{filter:brightness(1.06)}
.btn-ghost{flex:1;border:1px solid var(--line-strong);color:var(--ink-muted)}
.btn-ghost:hover{border-color:var(--ink-faint);color:var(--ink)}
.btn-danger{background:var(--danger);color:#fff}
.btn-danger:hover{filter:brightness(1.08)}
.btn .n{font-family:var(--mono);opacity:.75;font-weight:500;direction:ltr;unicode-bidi:isolate}

/* ---------- sheet ---------- */
.veil{
  position:fixed;inset:0;z-index:60;background:rgba(15,18,13,.42);
  display:flex;align-items:flex-end;justify-content:center;padding:16px;
}
@media (min-width:620px){.veil{align-items:center}}
.sheet{
  width:100%;max-width:568px;max-height:82dvh;overflow-y:auto;
  background:var(--ground);border:1px solid var(--line);
  /* Extra room at the bottom so the last button scrolls clear of the
     floating Netlify badge. */
  border-radius:16px;padding:20px 20px 72px;box-shadow:0 20px 60px rgba(0,0,0,.3);
}
.sheet-head{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.sheet-head h2{font-family:var(--display);font-weight:800;font-size:19px;margin-inline-end:auto}
.sheet-row{display:flex;gap:10px;margin-top:4px}
.sublabel{font-size:13px;color:var(--ink-faint);margin:4px 0 10px;line-height:1.5}
.linkbtn{font-size:14.5px;color:var(--accent);font-weight:600;padding:10px 2px;text-align:start}
.linkbtn.danger{color:var(--danger)}

/* Sheet form — 16px inputs so iOS doesn't zoom the page on focus. */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.field label{font-size:12px;color:var(--ink-faint);font-weight:700}
.field input{
  background:var(--surface);border:1px solid var(--line);border-radius:11px;
  padding:14px;font-size:16px;width:100%;
}
.field input:focus{border-color:var(--accent);outline:none}
.field.narrow input{width:140px}
.apicks{display:flex;flex-wrap:wrap;gap:7px}
.apick{
  display:flex;align-items:center;gap:6px;
  border:1px solid var(--line);background:var(--surface);
  border-radius:999px;padding:9px 13px;font-size:14px;color:var(--ink-muted);
}
.apick[data-sel="1"]{
  border-color:var(--accent);background:var(--accent-soft);
  color:var(--accent);font-weight:600;
}
.imgpick{display:flex;flex-direction:column;align-items:flex-start;gap:10px}
.imgprev{
  display:block;max-width:100%;max-height:160px;
  border-radius:11px;border:1px solid var(--line);background:var(--surface);
}
.imgbtns{display:flex;flex-wrap:wrap;gap:7px}
.imgbtn{
  display:flex;align-items:center;gap:7px;
  border:1px solid var(--line);background:var(--surface);
  border-radius:999px;padding:9px 14px;font-size:14px;color:var(--ink-muted);
}
.imgbtn:hover{border-color:var(--accent);color:var(--accent)}
.imgbtn:disabled{border-color:var(--line);color:var(--ink-faint);cursor:default}

function heNorm(s){

          .replace(/ף/g,"פ").replace(/ץ/g,"צ");

function wordHit(hay, needle){
  var i = hay.indexOf(needle);
  while(i !== -1){
    if(i === 0 || !/[a-z]/.test(hay.charAt(i-1))) return true;
    i = hay.indexOf(needle, i + 1);
  }
  return false;
}

  for(var i=0;i<CATS.length;i++){

      var w = heNorm(words[j]);

      var hit = HEBREW.test(w) ? (s.indexOf(w) !== -1) : wordHit(s, w);
      if(hit){ bestKey = key; bestLen = w.length; }
    }
  }
  return bestKey;
}

function parseEntry(raw){
  var s = String(raw).trim().replace(/\s+/g," ");
  var qty = "", urgent = false;
  if(/^!+|!+$/.test(s)){ urgent = true; s = s.replace(/^!+|!+$/g,"").trim(); }
  if(URGENT_TAIL.test(s) && s.replace(URGENT_TAIL,"").trim()){
    urgent = true; s = s.replace(URGENT_TAIL,"").trim();
  }
  var m = s.match(/\s*[x×*]\s*(\d+(?:\.\d+)?)$/i);
  if(m){ qty = m[1]; s = s.slice(0, m.index).trim(); }
  if(!qty){
    var m2 = s.match(/^(\d+(?:[.,]\d+)?)\s*(kg|kgs|g|gr|gram|l|lt|ml|pack|packs|ק"ג|קג|גרם|ליטר)?\s+(.+)$/i);
    if(m2 && m2[3]){
      qty = m2[1].replace(",",".") + (m2[2] ? m2[2].toLowerCase() : "");
      s = m2[3].trim();
    }
  }
  return {name:s, qty:qty, urgent:urgent};

  var groups = [];
  CATS.forEach(function(c){
    var of = arr.filter(function(it){ return (it.cat || "other") === c[0]; });
    if(of.length) groups.push({key:c[0], name:c[1], icon:c[2], items:of});
  });
  return groups;
}

/* Items on the list whose name the user could plausibly have meant. */
function findItems(q){
  var arr = sortedItems();
  var qs = slug(q), qk = matchKey(q);
  if(!qk) return [];
  var exact = arr.filter(function(it){ return slug(it.name) === qs; });
  if(exact.length) return exact;
  var keyed = arr.filter(function(it){ return matchKey(it.name) === qk; });
  if(keyed.length) return keyed;
  return arr.filter(function(it){
    var k = matchKey(it.name);
    return k && (k.indexOf(qk) !== -1 || qk.indexOf(k) !== -1);
  });
}

  if(!s) return null;
  var low = s.toLowerCase();

  var verb = null;
  for(var i=0;i<REMOVE_VERBS.length;i++){
    var v = REMOVE_VERBS[i];
    if(low.indexOf(v + " ") === 0){ verb = v; break; }
  }
  if(!verb) return null;

  var rest = s.slice(verb.length).trim();
  rest = rest.replace(/^(את|של|the|of)\s+/i,"").trim();
  for(var j=0;j<SCOPE_TAILS.length;j++){
    var tail = SCOPE_TAILS[j];
    if(rest.length > tail.length && rest.slice(-tail.length) === tail){
      rest = rest.slice(0, -tail.length).trim();
      break;
    }
  }
  rest = rest.replace(/\s+from\s+(the\s+)?(list|cart|basket)$/i,"").trim();
  if(!rest) return null;

  var t = rest.toLowerCase();
  if(CHECKED_TARGETS.indexOf(t) !== -1) return {action:"clearChecked"};
  if(ALL_TARGETS.indexOf(t) !== -1)     return {action:"clearAll"};

  /* An ambiguous verb with nothing to remove is just an item being added. */
  if(AMBIGUOUS_VERBS.indexOf(verb) !== -1 && !findItems(rest).length) return null;

  return {action:"removeItem", target:rest};
}

/* What the command would do, as rows for the suggestion box. */
function commandEntries(cmd){
  if(cmd.action === "clearChecked"){
    var n = doneCount();
    if(!n) return [{label:"אין פריטים מסומנים", muted:true}];
    return [{
      cmd:true,
      label:"מחיקת " + (n === 1 ? "הפריט המסומן" : n + " פריטים מסומנים"),
      run: function(){ clearChecked(); }
    }];
  }

  if(cmd.action === "clearAll"){
    var t = Object.keys(state.items).length;
    if(!t) return [{label:"הרשימה כבר ריקה", muted:true}];
    return [{
      cmd:true,
      label: t === 1 ? "מחיקת הפריט האחרון" : "מחיקת כל " + t + " הפריטים",
      run: function(){ confirmClearAll(); }
    }];
  }

  var hits = findItems(cmd.target);
  if(!hits.length){
    return [{label:"“" + cmd.target + "” לא נמצא ברשימה", muted:true}];
  }
  return hits.slice(0,5).map(function(it){
    return {
      cmd:true,
      label:"מחיקת " + it.name,
      sub: it.qty ? (/^\d+(\.\d+)?$/.test(it.qty) ? "×" + it.qty : it.qty) : "",
      run: function(){ removeItemRec(it.id); }
    };
  });
}

/* --------------------------------------------------------------- photos */

/* A photo rides inside its item's own document, so it's shrunk to what still
   reads as a label but keeps every sync small. JPEG because Safari's canvas
   can't encode WebP and would quietly hand back a far larger PNG. */
var PHOTO_STEPS = [[720,.72],[560,.66],[420,.6],[320,.55]];
var PHOTO_MAX = 200000;   /* characters of data URL, ~150 KB */

function shrinkPhoto(file){
  return new Promise(function(resolve, reject){
    if(file.type && !/^image\//.test(file.type)){ reject(new Error("not an image")); return; }
    var url = URL.createObjectURL(file);
    var im = new Image();
    im.onload = function(){
      URL.revokeObjectURL(url);
      var w = im.naturalWidth, h = im.naturalHeight, out = "";
      for(var i=0;i<PHOTO_STEPS.length;i++){
        var k = Math.min(1, PHOTO_STEPS[i][0] / Math.max(w, h));
        var c = document.createElement("canvas");
        c.width = Math.max(1, Math.round(w * k));
        c.height = Math.max(1, Math.round(h * k));
        var ctx = c.getContext("2d");
        /* JPEG has no alpha — a transparent screenshot would turn black. */
        ctx.fillStyle = "#fff";
        ctx.fillRect(0, 0, c.width, c.height);
        ctx.imageSmoothingQuality = "high";
        ctx.drawImage(im, 0, 0, c.width, c.height);
        out = c.toDataURL("image/jpeg", PHOTO_STEPS[i][1]);
        if(out.length <= PHOTO_MAX) break;
      }
      resolve(out);
    };
    im.onerror = function(){ URL.revokeObjectURL(url); reject(new Error("decode")); };
    im.src = url;
  });
}

/* Anyone with the link can write to the list, so only inline images are
   shown — a remote URL here would be a tracking pixel. */
function isPhoto(s){
  return typeof s === "string" && /^data:image\/(jpeg|png|webp);base64,/.test(s);
}

var CAMERA = [
  "M3 8.5a2 2 0 0 1 2-2h2.2l1.6-2.2h6.4l1.6 2.2H19a2 2 0 0 1 2 2V18a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z",
  "M12 16.4a3.4 3.4 0 1 0 0-6.8 3.4 3.4 0 0 0 0 6.8z"
];

/* ---------------------------------------------------------------- toast */

var toastTimer = null;
function flash(msg, action){
  var old = document.querySelector(".toast");
  if(old) old.remove();

  var t = el("div", action ? "toast with-action" : "toast");
  t.appendChild(el("span","msg", msg));
  if(action){
    var b = el("button","undo", action.label);
    b.type = "button";
    b.addEventListener("click", function(){
      clearTimeout(toastTimer);
      t.remove();
      action.run();
    });
    t.appendChild(b);
  }
  document.body.appendChild(t);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.remove(); }, action ? 7000 : 2600);
}

/* A removal stays undoable for as long as its toast is up. */
function offerUndo(items, msg){
  if(!items.length) return;
  flash(msg, {label:"החזר", run: function(){ restore(items); }});
}

async function restore(items){
  items.forEach(function(it){ state.items[it.id] = it; });
  render();
  if(local){ saveLocal(); }
  else {
    for(var i=0;i<items.length;i++){
      try{ await db.doc("items/" + items[i].id).set(items[i]); }
      catch(e){ handleWriteError(e); return; }
    }
  }
  flash(items.length === 1 ? "הוחזר לרשימה." : "הוחזרו " + items.length + " פריטים.");
}

/* ------------------------------------------------------------ persistence */

function saveLocal(){
  try{ localStorage.setItem(LS, JSON.stringify(state)); }
  catch(e){
    /* Photos are what fill device storage; say so rather than lose the
       change quietly on the next reload. */
    if(e && /quota/i.test(e.name || "")) flash("אין מקום במכשיר — כדאי להסיר כמה תמונות.");
  }
}
function loadLocal(){
  try{
    var raw = localStorage.getItem(LS);
    if(!raw) return;
    var d = JSON.parse(raw);
    if(d && typeof d === "object"){
      state.items   = d.items   || {};
      state.catalog = d.catalog || {};
      state.photos  = d.photos  || {};
      state.packs   = d.packs   || {};
      state.links   = d.links   || {};
    }
  }catch(e){}
}

function handleWriteError(e){
  var code = (e && e.code) || "";
  if(code === "permission-denied"){
    flash("הרשימה נעולה — צריך לעדכן את חוקי הגישה.");
  } else if(code === "unavailable"){
    /* Firestore queues the write and replays it once there's signal again. */
    flash("אין חיבור — השינוי יסונכרן כשתחזרו לרשת.");
  } else {
    flash("לא הצלחנו לשמור. בדקו את החיבור.");
  }
}

async function writeItem(item){
  state.items[item.id] = item;
  render();
  if(local){ saveLocal(); return; }
  try{ await db.doc("items/" + item.id).set(item); }
  catch(e){ handleWriteError(e); }
}
async function removeItemRec(id){
  var item = state.items[id];
  if(!item) return;
  delete state.items[id];
  render();
  /* Colon form sidesteps gender/number agreement with arbitrary item names. */
  offerUndo([item], "נמחק: " + item.name);
  if(local){ saveLocal(); return; }
  try{ await db.doc("items/" + id).delete(); }
  catch(e){ handleWriteError(e); }
}
async function writeCatalog(sl, entry){
  state.catalog[sl] = entry;
  if(local){ saveLocal(); return; }
  try{ await db.doc("catalog/" + sl).set(entry); }
  catch(e){ handleWriteError(e); }
}
/* A name dropped from autocomplete takes its remembered photo with it. */
async function removeCatalog(sl){
  delete state.catalog[sl];
  rememberPhoto(sl, "");
  if(local){ saveLocal(); return; }
  try{ await db.doc("catalog/" + sl).delete(); }catch(e){}
}

/* Photos are remembered by name in their own collection rather than on the
   catalog, which every device downloads whole on open — so only the photo
   for a name being added again is ever fetched. "" forgets it. */
async function rememberPhoto(sl, img){
  if(local){
    if(img) state.photos[sl] = img; else delete state.photos[sl];
    saveLocal();
    return;
  }
  try{
    if(img) await db.doc("photos/" + sl).set({img: img});
    else await db.doc("photos/" + sl).delete();
  }catch(e){ handleWriteError(e); }
}
async function recallPhoto(sl){
  if(local) return state.photos[sl] || "";
  try{
    var snap = await db.doc("photos/" + sl).get();
    var v = snap.exists ? snap.data() : null;
    return (v && isPhoto(v.img)) ? v.img : "";
  }catch(e){ return ""; }   /* offline and never fetched here: go without */
}

/* The item is already on the list by now; its photo follows once fetched,
   so adding never waits on the network. */
async function attachRemembered(id, sl){
  var img = await recallPhoto(sl);
  var cur = state.items[id];
  if(img && cur && !cur.img && slug(cur.name) === sl){
    writeItem(Object.assign({}, cur, {img: img}));
  }
}
async function deleteIds(ids){
  ids.forEach(function(id){ delete state.items[id]; });
  render();
  if(local){ saveLocal(); return; }
  for(var i=0;i<ids.length;i++){
    try{ await db.doc("items/" + ids[i]).delete(); }
    catch(e){ handleWriteError(e); break; }
  }
}

/* --------------------------------------------------------------- actions */

/* opts.pack: adding as part of a pack — no toast, and an item that's already
   waiting on the list is left alone rather than bumped (the pack means "make
   sure these are on it", not "buy another"). Returns what changed, for undo:
   {added:id} or {prev:item}, or null if nothing did. */
function addItem(rawName, presetQty, opts){
  opts = opts || {};
  var parsed = parseEntry(rawName);
  if(!parsed.name) return null;
  var sl = slug(parsed.name);
  var known = state.catalog[sl];

  /* Same item already on the list? Bump it rather than duplicating. */
  var existing = null;
  Object.keys(state.items).forEach(function(k){
    if(slug(state.items[k].name) === sl) existing = state.items[k];
  });
  if(existing){
    var next = Object.assign({}, existing, {done: false});
    if(parsed.urgent) next.urgent = true;
    if(opts.pack){
      if(!existing.done && (!parsed.urgent || existing.urgent)) return null;
    } else {
      next.qty = String(multiplier(existing.qty) + multiplier(presetQty || parsed.qty || "1"));
    }
    writeItem(next);
    if(!opts.pack){
      flash(parsed.urgent && !existing.urgent
        ? "כבר ברשימה — סומן כדחוף, עכשיו " + next.qty + "."
        : "כבר ברשימה — עכשיו " + next.qty + ".");
    }
    return {prev: existing};
  }

  var cat = (known && known.cat) || guessCat(parsed.name);
  var item = {
    id: uid(),
    name: known ? known.name : parsed.name,
    qty: presetQty || parsed.qty || "",
    cat: cat,
    addedBy: myName || "",
    done: false,
    ts: Date.now()
  };
  if(parsed.urgent) item.urgent = true;
  writeItem(item);

  /* Remember the name so it autocompletes next time — or, if it's been
     added before, bring back the photo it had. */
  if(!known) writeCatalog(sl, {name: parsed.name, cat: cat});
  else attachRemembered(item.id, sl);

  /* Say where it landed, with one tap to move it if the guess was wrong. */
  if(!opts.pack){
    flash(catIcon(cat) + (item.urgent ? " נוסף כדחוף ל" : " נוסף ל") + catLabel(cat), {
      label: "עריכה",
      run: function(){ openEditItem(state.items[item.id] || item); }
    });
  }
  return {added: item.id};
}

/* Adds every line of a pack, then offers one undo for the lot. */
function addPack(pack){
  var changes = [];
  pack.items.forEach(function(line){
    var c = addItem(line, null, {pack:true});
    if(c) changes.push(c);
  });
  if(!changes.length){ flash("כל מה שב" + pack.name + " כבר ברשימה."); return; }
  var n = changes.length;
  flash((n === 1 ? "נוסף פריט אחד" : "נוספו " + n + " פריטים") + " · " + pack.name, {
    label: "ביטול",
    run: function(){ undoPack(changes); }
  });
}
async function undoPack(changes){
  var del = [], back = [];
  changes.forEach(function(c){
    if(c.added){ if(state.items[c.added]) del.push(c.added); }
    else if(state.items[c.prev.id]) back.push(c.prev);
  });
  back.forEach(function(it){ state.items[it.id] = it; });
  await deleteIds(del);   /* renders and saves for both */
  if(!local){
    for(var i=0;i<back.length;i++){
      try{ await db.doc("items/" + back[i].id).set(back[i]); }
      catch(e){ handleWriteError(e); return; }
    }
  }
  flash("בוטל.");
}

function toggleDone(id){
  var it = state.items[id];
  if(!it) return;
  writeItem(Object.assign({}, it, {done: !it.done}));
}

function toggleUrgent(id){
  var it = state.items[id];
  if(!it) return;
  var next = Object.assign({}, it);
  if(it.urgent) delete next.urgent; else next.urgent = true;
  writeItem(next);
}

function clearChecked(){
  var done = Object.keys(state.items).filter(function(k){ return state.items[k].done; });
  if(!done.length){ flash("עוד לא סימנתם כלום."); return; }
  var removed = done.map(function(k){ return state.items[k]; });
  deleteIds(done);
  offerUndo(removed, removed.length === 1
    ? "נמחק פריט אחד."
    : "נמחקו " + removed.length + " פריטים.");
}

/* Renaming a mistyped item also drops the typo from autocomplete.
   photo: undefined leaves it alone, "" removes it, a data URL replaces it. */
function renameItem(id, newName, newQty, cat, photo, urgent){
  var cur = state.items[id];
  if(!cur){ flash("הפריט כבר לא ברשימה."); return; }

  var oldSlug = slug(cur.name), newSlug = slug(newName);

  /* Fixing a typo onto a name that's already listed merges the two rather
     than leaving a duplicate behind. */
  var twin = null;
  Object.keys(state.items).forEach(function(k){
    if(k !== id && slug(state.items[k].name) === newSlug) twin = state.items[k];
  });
  if(twin){
    var merged = Object.assign({}, twin, {
      name: newName,
      qty: String(multiplier(twin.qty) + multiplier(newQty || "1")),
      cat: cat,
      done: false
    });
    if(urgent || twin.urgent) merged.urgent = true;
    /* The photo you were editing wins; otherwise the twin keeps its own. */
    var mine = (photo === undefined) ? cur.img : photo;
    if(mine) merged.img = mine;
    writeItem(merged);
    if(mine && mine !== twin.img) rememberPhoto(newSlug, mine);
    deleteIds([id]);
    flash("אוחד עם " + newName + ".");
    return;
  }

  var next = Object.assign({}, cur, {name:newName, qty:newQty, cat:cat});
  if(urgent) next.urgent = true; else delete next.urgent;
  if(photo === "") delete next.img;
  else if(photo) next.img = photo;
  writeItem(next);

  /* The photo belongs to the name too: a new one is remembered, a removed
     one forgotten, and a rename carries it over — or picks up the photo the
     new name already had. */
  if(photo !== undefined) rememberPhoto(newSlug, photo);
  else if(newSlug !== oldSlug){
    if(next.img) rememberPhoto(newSlug, next.img);
    else attachRemembered(id, newSlug);
  }

  if(newSlug !== oldSlug){
    var stillUsed = Object.keys(state.items).some(function(k){
      return slug(state.items[k].name) === oldSlug;
    });
    if(!stillUsed && state.catalog[oldSlug]) removeCatalog(oldSlug);
  }
  writeCatalog(newSlug, {name:newName, cat:cat});
}

/* ---------------------------------------------------------------- render */

function render(){
  renderPacks();
  renderProgress();
  renderList();
  renderDock();
  paintPeople();
}

function renderProgress(){
  var total = Object.keys(state.items).length;
  var got = doneCount();
  var wrap = document.getElementById("progress");

  /* Only worth showing once a run is under way. */
  wrap.hidden = !got;
  if(!got) return;

  document.getElementById("pbar-fill").style.width =
    Math.round(got / total * 100) + "%";
  document.getElementById("ptext").textContent =
    "בעגלה " + got + " מתוך " + total;
}

function renderList(){
  var body = document.getElementById("list-body");
  body.textContent = "";
  var items = sortedItems();

  if(!items.length){ body.appendChild(emptyState()); return; }

  groupByAisle(items).forEach(function(g){
    /* unchecked first inside each aisle, so what's left floats to the top */
    var ordered = g.items.slice().sort(function(a,b){ return (a.done?1:0) - (b.done?1:0); });
    var left = g.items.filter(function(i){ return !i.done; }).length;
    body.appendChild(aisleHead(g, left));
    ordered.forEach(function(it){ body.appendChild(itemRow(it)); });
  });

  if(doneCount() === items.length){
    var done = el("div","donenote");
    done.appendChild(el("div","cheer","✅"));
    done.appendChild(el("div","big","זהו, הכל נאסף."));
    done.appendChild(el("p",null,"אפשר לנקות את העגלה מלמטה."));
    body.appendChild(done);
  }
}

function aisleHead(g, left){
  var h = el("div","aisle");
  var head = el("div","aisle-head");
  var ico = el("span","ico", g.icon);
  ico.setAttribute("aria-hidden","true");
  head.appendChild(ico);
  var h2 = el("h2",null,g.name);
  h2.setAttribute("dir","auto");
  head.appendChild(h2);
  head.appendChild(el("span","count num", String(left)));
  h.appendChild(head);
  return h;
}

function itemRow(it){
  var row = el("div","row");
  row.dataset.done = it.done ? "1" : "0";
  /* Urgent stays in its aisle, just highlighted. */
  row.dataset.urgent = it.urgent ? "1" : "0";

  var check = el("button","check");
  check.type = "button";
  check.setAttribute("aria-pressed", it.done ? "true" : "false");
  check.setAttribute("aria-label", (it.done ? "ביטול סימון " : "סימון ") + it.name);
  check.appendChild(svg(["M4.5 12.5l5 5 10-11"], "3"));
  check.addEventListener("click", function(){ toggleDone(it.id); });
  row.appendChild(check);

  var main = el("button","r-main");
  main.type = "button";
  var nm = el("div","r-name", it.name);
  nm.setAttribute("dir","auto");
  main.appendChild(nm);

  var sub = el("div","r-sub");
  if(it.qty) sub.appendChild(el("span","qty", it.qty));
  if(it.addedBy){
    var dot = el("span","person");
    dot.style.width = "16px"; dot.style.height = "16px"; dot.style.fontSize = "8px";
    dot.dataset.who = it.addedBy;
    sub.appendChild(dot);
  }
  if(sub.childNodes.length) main.appendChild(sub);

  main.addEventListener("click", function(){ toggleDone(it.id); });
  row.appendChild(main);

  if(isPhoto(it.img)){
    var thumb = el("button","r-thumb");
    thumb.type = "button";
    thumb.setAttribute("aria-label","תמונה של " + it.name);
    var ti = el("img");
    ti.src = it.img; ti.alt = "";
    thumb.appendChild(ti);
    thumb.addEventListener("click", function(){ openPhoto(it); });
    row.appendChild(thumb);
  }

  /* One tap to flag it, without opening the edit sheet. */
  var flag = el("button","r-urgent");
  flag.type = "button";
  flag.setAttribute("aria-pressed", it.urgent ? "true" : "false");
  flag.setAttribute("aria-label", (it.urgent ? "ביטול דחיפות " : "סימון כדחוף ") + it.name);
  flag.appendChild(svg(["M12 4.5v9.5","M12 19.2h.01"], "2.8"));
  flag.addEventListener("click", function(ev){
    ev.stopPropagation();
    toggleUrgent(it.id);
  });
  row.appendChild(flag);

  var more = el("button","r-more");
  more.type = "button";
  more.setAttribute("aria-label","עריכת " + it.name);
  more.appendChild(svg(["M12 5.4h.01","M12 12h.01","M12 18.6h.01"], "2.6"));
  more.addEventListener("click", function(ev){
    ev.stopPropagation();
    openEditItem(it);
  });
  row.appendChild(more);

  return row;
}

function openEditItem(it){
  var chosenCat = it.cat || "other";
  var catTouched = false;

  openSheet(function(sheet){
    sheetHead(sheet, "עריכת פריט");

    var f1 = el("div","field");
    var l1 = el("label",null,"שם");
    l1.setAttribute("for","edit-name");
    var i1 = el("input");
    i1.type = "text"; i1.id = "edit-name"; i1.name = "edit-name";
    i1.value = it.name;
    i1.setAttribute("dir","auto");
    i1.setAttribute("autocomplete","off");
    f1.appendChild(l1); f1.appendChild(i1);
    sheet.appendChild(f1);

    var f2 = el("div","field narrow");
    var l2 = el("label",null,"כמות");
    l2.setAttribute("for","edit-qty");
    var i2 = el("input");
    i2.type = "text"; i2.id = "edit-qty"; i2.name = "edit-qty";
    i2.value = it.qty || "";
    i2.placeholder = "2";
    i2.setAttribute("dir","auto");
    f2.appendChild(l2); f2.appendChild(i2);
    sheet.appendChild(f2);

    var urgent = !!it.urgent;
    var f5 = el("div","field");
    var tg = el("button","toggle");
    tg.type = "button";
    var tm = el("span","t-main");
    tm.appendChild(document.createTextNode("🔥 דחוף"));
    tm.appendChild(el("span","t-sub","מודגש ברשימה, כדי שלא יישכח."));
    tg.appendChild(tm);
    tg.appendChild(el("span","knob"));
    var paintUrgent = function(){ tg.setAttribute("aria-pressed", urgent ? "true" : "false"); };
    tg.addEventListener("click", function(){ urgent = !urgent; paintUrgent(); });
    paintUrgent();
    f5.appendChild(tg);
    sheet.appendChild(f5);

    /* The exact product for price comparison — chosen in its own sheet and
       saved straight away, by name. */
    var f6 = el("div","field");
    f6.appendChild(el("label",null,"מוצר להשוואת מחירים"));
    var lf = el("button","linkfield");
    lf.type = "button";
    var lm = el("span","lf-main");
    var link = state.links[slug(it.name)];
    lm.appendChild(document.createTextNode(link ? link.name : "אוטומטי"));

/* ---------------------------------------------------------------- prices */

/* The chains' own price lists, refreshed twice a day into prices/ by a
   GitHub Action (scripts/fetch_prices.py). Each product is
   [code, name, price, perUnit, perUnitOf, size, weighted]. Regular prices
   only — sales aren't included. */

var LS_BRANCHES = "marketrun.branches";   /* per device: chain -> store */

/* What people write on a list vs. what the shelf label says. */
var SYNONYMS = {
  "גמבה":"פלפל אדום", "גמבות":"פלפל אדום",
  "תפוא":"תפוח אדמה", "תפוחי אדמה":"תפוח אדמה", "תפודים":"תפוח אדמה"
};

var prices = null;          /* {index, chains, groups, list} once loaded */
var pricesLoading = null;   /* promise while loading, keyed by branches */
var pricesKey = "";
var priceSheetPaint = null;

function myBranches(){
  try{ return JSON.parse(localStorage.getItem(LS_BRANCHES) || "{}") || {}; }
  catch(e){ return {}; }
}
function setBranch(chain, store){
  var b = myBranches();
  b[chain] = store;
  try{ localStorage.setItem(LS_BRANCHES, JSON.stringify(b)); }catch(e){}
  prices = null; pricesLoading = null;
}

function getJSON(path){
  return fetch(path, {cache:"no-cache"}).then(function(r){
    if(!r.ok) throw new Error(path + " " + r.status);
    return r.json();
  });
}
function loadIndex(){ return getJSON("prices/index.json"); }

/* Search text: final letters folded, punctuation dropped. */
function pnorm(s){
  return heNorm(String(s).toLowerCase()).replace(/[^\p{L}\p{N}% ]/gu," ")
    .replace(/\s+/g," ").trim();
}
/* Singular and plural meet: עגבניות / עגבניה, מלפפונים / מלפפון. Text is
   already through heNorm, so ים arrives as ימ. A bare final ה is left alone
   — חלבה is not חלב. */
function pstem(word){
  if(word.length <= 3) return word;
  return word.replace(/(יות|יה)$/,"י").replace(/(ימ|ות)$/,"");
}
function pstemAll(s){ return s.split(" ").map(pstem).join(" "); }

/* Products are grouped across chains by barcode. Produce is sold by weight
   under each chain's own code, so those group by name instead; short codes
   are chain-internal and never shared. */
function groupKey(chain, p){
  if(p[6]) return "w:" + pstemAll(pnorm(p[1]));
  if(String(p[0]).length < 8) return "c:" + chain + ":" + p[0];
  return p[0];
}

function loadPrices(){
  var chosen = myBranches();
  var key = JSON.stringify(chosen);
  if(prices && pricesKey === key) return Promise.resolve(prices);
  if(pricesLoading && pricesKey === key) return pricesLoading;
  pricesKey = key;
  pricesLoading = loadIndex().then(function(index){
    var chains = index.chains.map(function(c){
      var store = chosen[c.id];
      var br = c.branches.filter(function(b){ return b.store === store; })[0] ||
               c.branches.filter(function(b){ return b.store === c.default; })[0] ||
               c.branches[0];
      return {id:c.id, name:c.name, store:br.store, branch:br.name, file:br.file, priced:br.priced};
    });
    return Promise.all(chains.map(function(c){ return getJSON("prices/" + c.file); }))
      .then(function(files){
        var groups = new Map();
        files.forEach(function(f, i){
          var cid = chains[i].id;
          f.items.forEach(function(p){
            var k = groupKey(cid, p);
            var g = groups.get(k);
            if(!g){
              g = {key:k, name:p[1], n:pnorm(p[1]), size:p[5], weighted:!!p[6], by:{}};
              g.stem = pstemAll(g.n);
              groups.set(k, g);
            }
            var cur = g.by[cid];
            /* the same thing listed twice: keep the cheaper */
            if(!cur || p[2] < cur.price){
              g.by[cid] = {code:p[0], name:p[1], price:p[2], unit:p[3], unitOf:p[4], size:p[5], w:!!p[6]};
            }
            /* the longest name is the least truncated one */
            if(p[1].length > g.name.length && !p[6]){ g.name = p[1]; g.n = pnorm(p[1]); g.stem = pstemAll(g.n); }
          });
        });
        var list = Array.from(groups.values());
        list.forEach(function(g){ g.cover = Object.keys(g.by).length; });
        prices = {index:index, chains:chains, groups:groups, list:list};
        return prices;
      });
  });
  pricesLoading.catch(function(){ pricesLoading = null; });
  return pricesLoading;
}

/* Ranked products for a query. In order: the exact name; a name that opens
   with the word (חלב 3% before שוקו חלב); every word whole (לחם before
   לחמית); sold by weight (fresh produce); what the most chains carry; the plainest (shortest) name; the
   cheapest. */
function searchProducts(q, limit){
  var qn = pnorm(q);
  if(SYNONYMS[qn]) qn = pnorm(SYNONYMS[qn]);
  if(!qn || !prices) return [];
  var stems = qn.split(" ").map(pstem).filter(Boolean);
  var qstem = stems.join(" ");
  /* For fruit and veg a final ה is noise too (בננות / בננה); elsewhere it
     isn't (חלב / חלבה), so that only loosens for produce. */
  var produce = guessCat(qn) === "produce";
  var loose = function(x){ return produce ? x.replace(/ה( |$)/g,"$1") : x; };
  stems = stems.map(loose);
  qstem = loose(qstem);
  var hits = [];
  for(var i=0;i<prices.list.length;i++){
    var g = prices.list[i], gs = loose(g.stem), hay = " " + gs;
    var ok = true;
    for(var j=0;j<stems.length;j++){
      if(hay.indexOf(" " + stems[j]) === -1){ ok = false; break; }
    }
    if(!ok) continue;
    var words = gs.split(" ");
    hits.push({g:g, rank:[
      gs === qstem ? 0 : 1,
      words[0] === stems[0] ? 0 : 1,
      stems.every(function(x){ return words.indexOf(x) !== -1; }) ? 0 : 1,
      (produce && g.weighted) ? 0 : 1,   /* loose produce, not a bag of chips */
      -g.cover,
      gs.indexOf(stems[0]) === 0 ? 0 : 1,
      g.n.length,
      Math.min.apply(null, Object.keys(g.by).map(function(c){ return g.by[c].price; }))
    ]});
  }
  hits.sort(function(a,b){
    for(var k=0;k<a.rank.length;k++){
      if(a.rank[k] !== b.rank[k]) return a.rank[k] - b.rank[k];
    }
    return 0;
  });
  return hits.slice(0, limit || 40).map(function(h){ return h.g; });
}

/* What an item costs at each chain. A chosen product is used exactly; with
   none, the best match by name, and a chain that lacks it gets its own
   nearest match, marked approximate. */
function resolveItem(it){
  var link = state.links[slug(it.name)];
  var per = {}, g = null;
  if(link){
    g = prices.groups.get(link.key) || null;
    prices.chains.forEach(function(c){
      per[c.id] = (g && g.by[c.id]) ? {p:g.by[c.id], approx:false} : null;
    });
    return {g:g, linked:link, per:per};
  }
  var res = searchProducts(it.name, 60);
  g = res[0] || null;
  prices.chains.forEach(function(c){
    if(g && g.by[c.id]){ per[c.id] = {p:g.by[c.id], approx:false}; return; }
    var alt = res.filter(function(r){ return r.by[c.id]; })[0];
    per[c.id] = alt ? {p:alt.by[c.id], approx:true} : null;
  });
  return {g:g, linked:null, per:per};
}

function money(n){ return n.toFixed(2).replace(/\.00$/,""); }
function shortTime(iso){
  var d = new Date(String(iso || "").replace(/Z$/,":00Z"));
  if(isNaN(d)) return "";
  var p = function(n){ return (n < 10 ? "0" : "") + n; };
  return p(d.getDate()) + "." + p(d.getMonth() + 1) + " " + p(d.getHours()) + ":" + p(d.getMinutes());
}

async function setLink(sl, v){
  if(v) state.links[sl] = v; else delete state.links[sl];
  if(local){ saveLocal(); return; }
  try{
    if(v) await db.doc("links/" + sl).set(v);
    else await db.doc("links/" + sl).delete();
  }catch(e){ handleWriteError(e); }
}

function refreshPrices(){
  if(priceSheetPaint && !document.getElementById("veil").hidden) priceSheetPaint();
}

function priceLoading(sheet, title){
  sheetHead(sheet, title);
  sheet.appendChild(el("div","loading","טוען מחירים…"));
}

/* ₪ — the whole list, priced at each chain. */
function openPrices(){
  openSheet(function(sheet){
    priceLoading(sheet, "השוואת מחירים");
    var gen = sheetGen;
    loadPrices().then(function(){
      if(!stillOpen(gen)) return;
      priceSheetPaint = function(){ paintPrices(sheet); };
      priceSheetPaint();
    }, function(){ if(stillOpen(gen)) priceError(sheet); });
  }, "השוואת מחירים");
}

function paintPrices(sheet){
  sheet.textContent = "";
  sheetHead(sheet, "השוואת מחירים");
  var chains = prices.chains;

  var sub = el("div","sublabel");
  sub.appendChild(document.createTextNode(
    chains.map(function(c){ return c.name + " " + c.branch; }).join(" · ") +
    ". מחירים רגילים, בלי מבצעים. עודכן " + shortTime(prices.index.updated) + ". "));
  var chg = el("button","linkbtn","החלפת סניפים");
  chg.type = "button";
  chg.style.padding = "0";
  chg.style.fontSize = "13px";
  chg.addEventListener("click", openSettings);
  sub.appendChild(chg);
  sheet.appendChild(sub);

  var items = sortedItems();
  if(!items.length){
    sheet.appendChild(el("div","loading","הרשימה ריקה — אין מה להשוות."));
    return;
  }

  var rows = items.map(function(it){ return {it:it, r:resolveItem(it)}; });

  /* Totals only over items every chain has, so the comparison is fair.
     Sold by weight counts as 1 kg (or the quantity, if it's a number). */
  var sums = {}, counted = 0, skipped = 0;
  chains.forEach(function(c){ sums[c.id] = 0; });
  rows.forEach(function(row){
    var all = chains.every(function(c){ return row.r.per[c.id]; });
    if(!all){ skipped++; return; }
    counted++;
    var m = multiplier(row.it.qty);
    chains.forEach(function(c){ sums[c.id] += row.r.per[c.id].p.price * m; });
  });

  var totals = el("div","totals");
  var best = counted ? Math.min.apply(null, chains.map(function(c){ return sums[c.id]; })) : 0;
  chains.forEach(function(c){
    var t = el("div","total");
    t.dataset.best = (counted && sums[c.id] === best) ? "1" : "0";
    t.appendChild(el("div","t-chain", c.name));
    t.appendChild(el("div","t-sum", counted ? "₪" + money(sums[c.id]) : "—"));
    var d = sums[c.id] - best;
    t.appendChild(el("div","t-diff", !counted ? "" : (d > 0.004 ? "+₪" + money(d) : "הכי זול")));
    totals.appendChild(t);
  });
  sheet.appendChild(totals);

  var note = counted
    ? "הסכום כולל " + counted + " מתוך " + items.length + " פריטים — רק מה שנמצא בכל שלוש הרשתות."
    : "אין עדיין פריט שנמצא בכל שלוש הרשתות.";
  if(skipped) note += " פריט בלי מחיר באחת הרשתות לא נספר.";
  sheet.appendChild(el("p","pnote", note + " ירקות ופירות נספרים לפי ק״ג."));

  var head = el("div","pgrid phead");
  head.appendChild(el("span",null,"פריט"));
  head.firstChild.style.textAlign = "start";
  chains.forEach(function(c){ head.appendChild(el("span",null,c.name)); });
  sheet.appendChild(head);

  rows.forEach(function(row){
    var it = row.it, r = row.r;
    var b = el("button","pgrid prow");
    b.type = "button";
    var main = el("div");
    var nm = el("div","p-name", it.name + (it.qty ? " ×" + it.qty : ""));
    nm.setAttribute("dir","auto");
    main.appendChild(nm);
    var mt = el("div","p-match");
    if(r.linked){
      mt.appendChild(el("b",null,"✓ "));
      mt.appendChild(document.createTextNode(r.g ? r.g.name : r.linked.name + " (לא נמצא כרגע)"));
    } else if(r.g){
      mt.appendChild(document.createTextNode("אוטומטי: " + r.g.name + (r.g.size ? " · " + r.g.size : "")));
    } else {
      mt.className = "p-match none";
      mt.textContent = "לא נמצא — הקישו לבחירה";
    }
    mt.setAttribute("dir","auto");
    main.appendChild(mt);
    b.appendChild(main);

    var vals = chains.map(function(c){ return r.per[c.id] ? r.per[c.id].p.price : null; });
    var have = vals.filter(function(v){ return v != null; });
    var low = have.length > 1 ? Math.min.apply(null, have) : null;
    chains.forEach(function(c, i){
      var x = r.per[c.id];
      var cell = el("span","pp", x ? money(x.p.price) : "—");
      if(x && low != null && x.p.price === low) cell.dataset.best = "1";
      if(x && x.approx) cell.dataset.approx = "1";
      if(x && x.p.w) cell.appendChild(el("small",null,"לק״ג"));
      b.appendChild(cell);
    });
    b.addEventListener("click", function(){ openPicker(it, openPrices); });
    sheet.appendChild(b);
  });

  sheet.appendChild(el("p","pnote","≈ — המוצר המדויק לא נמצא ברשת הזו, מוצג הדומה ביותר. הקישו על פריט כדי לבחור את המוצר המדויק; הבחירה נשמרת לפי השם, לשניכם."));
}

/* Pick the exact product an item means. back() returns to wherever it was
   opened from. */
function openPicker(it, back){
  var sl = slug(it.name);
  openSheet(function(sheet){
    priceLoading(sheet, "בחירת מוצר");
    var gen = sheetGen;
    loadPrices().then(function(){ if(stillOpen(gen)) paint(); },
                      function(){ if(stillOpen(gen)) priceError(sheet); });

    function paint(){
      sheet.textContent = "";
      sheetHead(sheet, "בחירת מוצר: " + it.name);
      sheet.appendChild(el("div","sublabel","המוצר שישמש להשוואת מחירים בכל פעם שתוסיפו " + it.name + "."));

      var f = el("div","field");
      var inp = el("input");
      inp.type = "search"; inp.name = "product-search";
      inp.value = it.name;
      inp.setAttribute("dir","auto");
      inp.setAttribute("autocomplete","off");
      inp.setAttribute("aria-label","חיפוש מוצר");
      f.appendChild(inp);
      sheet.appendChild(f);

      var cur = state.links[sl];
      if(cur){
        var auto = el("button","linkbtn","חזרה לבחירה אוטומטית");
        auto.type = "button";
        auto.addEventListener("click", function(){
          setLink(sl, null);
          flash("חזר לבחירה אוטומטית.");
          back();
        });
        sheet.appendChild(auto);
      }

      var res = el("div","picker-res");
      sheet.appendChild(res);

      var draw = function(){
        res.textContent = "";
        var hits = searchProducts(inp.value, 40);
        if(!hits.length){ res.appendChild(el("div","loading","לא נמצא. נסו מילה אחרת.")); return; }
        hits.forEach(function(g){
          var b = el("button","pick");
          b.type = "button";
          if(cur && cur.key === g.key) b.dataset.sel = "1";
          var nm = el("div","k-name", g.name);
          nm.setAttribute("dir","auto");
          if(g.size || g.weighted) nm.appendChild(el("span","k-size", g.weighted ? "לק״ג" : g.size));
          b.appendChild(nm);
          var ps = el("div","k-prices");
          prices.chains.forEach(function(c){
            var p = g.by[c.id];
            var chip = el("span", p ? "k-p" : "k-p miss", c.name + " " + (p ? "₪" + money(p.price) : "—"));
            ps.appendChild(chip);
          });
          b.appendChild(ps);
          b.addEventListener("click", function(){
            setLink(sl, {key:g.key, name:g.name});
            flash("נבחר: " + g.name);
            back();
          });
          res.appendChild(b);
        });
      };
      var t = null;
      inp.addEventListener("input", function(){ clearTimeout(t); t = setTimeout(draw, 120); });
      draw();
    }
  }, "בחירת מוצר");
}

/* A stable colour per name, so you two are consistently different. */
function colorFor(name){
  var h = 0;
  for(var i=0;i<name.length;i++) h = (h * 31 + name.charCodeAt(i)) % 360;
  return "hsl(" + h + " 42% 40%)";
}

/* Names are typed by people — always set via textContent. */
function paintPeople(){
  var distinct = {};
  sortedItems().forEach(function(i){ if(i.addedBy) distinct[i.addedBy] = 1; });
  var many = Object.keys(distinct).length > 1;

  Array.prototype.forEach.call(document.querySelectorAll("[data-who]"), function(n){
    var who = n.dataset.who;
    if(n.id !== "me-chip") n.hidden = !(many && who);
    if(!who) return;
    n.textContent = who.trim().charAt(0) || "?";
    n.style.background = colorFor(who);
    n.title = (who === myName) ? who + " (את/ה)" : who;
  });
}

function setMyName(name){
  myName = String(name || "").trim().slice(0, 24);
  try{ localStorage.setItem(LS_NAME, myName); }catch(e){}
  var chip = document.getElementById("me-chip");
  chip.hidden = !myName;
  chip.dataset.who = myName;
  render();
}

/* -------------------------------------------------------------- suggest */

/* Packs whose name matches, offered above the single items. */
function packEntries(raw){
  var q = heNorm(raw.toLowerCase().replace(/^!+|!+$/g,"").trim());
  if(!q) return [];
  return sortedPacks().filter(function(p){
    return heNorm(p.name.toLowerCase()).indexOf(q) !== -1;
  }).slice(0,3).map(function(p){
    return {
      cmd:true,
      label:"📦 " + p.name,
      sub:"חבילה · " + p.items.length + " פריטים",
      run:function(){ addPack(p); }
    };
  });
}

/* Names you've added before, for plain-text autocomplete. */
function catalogEntries(raw){
  var query = raw.toLowerCase().replace(/^!+|!+$/g,"").trim();
  var urgent = /^!|!$/.test(raw);
  if(!query) return [];
  var onList = {};
  Object.keys(state.items).forEach(function(k){ onList[slug(state.items[k].name)] = 1; });

  return Object.keys(state.catalog)
    .map(function(k){ return state.catalog[k]; })
    .filter(function(c){
      return c && c.name && !onList[slug(c.name)] &&
             c.name.toLowerCase().indexOf(query) !== -1;
    })
    .slice(0,5)
    .map(function(c){
      return {label:c.name, sub:catIcon(c.cat), run:function(){ addItem(urgent ? c.name + "!" : c.name); }};
    });
}

function closeSuggest(){
  document.getElementById("suggest").hidden = true;
  suggestList = []; suggestIdx = -1;
}

function renderSuggest(q){
  var box = document.getElementById("suggest");
  box.textContent = "";
  suggestList = [];
  suggestIdx = -1;

  var raw = String(q).trim();
  if(!raw){ box.hidden = true; return; }

  var cmd = parseCommand(raw);
  var entries = cmd ? commandEntries(cmd) : packEntries(raw).concat(catalogEntries(raw));
  if(!entries.length){ box.hidden = true; return; }
  suggestList = entries;

  entries.forEach(function(e, i){
    var b = el("button");
    b.type = "button";
    b.dataset.i = String(i);
    if(e.cmd) b.className = "s-cmd";
    if(e.muted) b.disabled = true;
    var n = el("span","s-name", e.label);
    n.setAttribute("dir","auto");
    b.appendChild(n);
    if(e.sub) b.appendChild(el("span","s-sub", e.sub));
    b.addEventListener("click", function(){
      if(e.muted) return;
      e.run();
      document.getElementById("add-input").value = "";
      closeSuggest();
    });
    box.appendChild(b);
  });
  box.hidden = false;
}

function moveSuggest(d){
  var box = document.getElementById("suggest");
  if(box.hidden || !suggestList.length) return false;
  var usable = suggestList.filter(function(x){ return !x.muted; }).length;
  if(!usable) return false;
  var i = (suggestIdx === -1 && d === -1) ? 0 : suggestIdx;
  do { i = (i + d + suggestList.length) % suggestList.length; }
  while(suggestList[i].muted);
  suggestIdx = i;
  Array.prototype.forEach.call(box.children, function(c, k){
    c.dataset.active = (k === suggestIdx) ? "1" : "0";
  });
  return true;
}

/* ----------------------------------------------------------------- wire */

document.getElementById("add-form").addEventListener("submit", function(e){
  e.preventDefault();
  var input = document.getElementById("add-input");
  var raw = input.value.trim();
  if(!raw) return;

  var picked = (suggestIdx >= 0) ? suggestList[suggestIdx] : null;
  if(picked && !picked.muted){
    picked.run();
  } else {
    var cmd = parseCommand(raw);
    if(cmd){
      var entries = commandEntries(cmd);
      var live = entries.filter(function(x){ return !x.muted; });
      if(live.length === 1){
        live[0].run();
      } else if(!live.length){
        /* Keep what they typed so a typo is one edit away from working. */
        flash(entries[0] ? entries[0].label : "לא נמצא");
        return;
      } else {
        flash("יש כמה כאלה — בחרו אחד");
        return;
      }
    } else {
      var exactPack = sortedPacks().filter(function(p){ return slug(p.name) === slug(raw); })[0];
      if(exactPack) addPack(exactPack);
      else addItem(raw);
    }
  }
  input.value = "";
  closeSuggest();
  input.focus();
});

document.getElementById("add-input").addEventListener("input", function(e){
  renderSuggest(e.target.value);
});
document.getElementById("add-input").addEventListener("keydown", function(e){
  if(e.key === "ArrowDown"){ if(moveSuggest(1)) e.preventDefault(); }
  else if(e.key === "ArrowUp"){ if(moveSuggest(-1)) e.preventDefault(); }
  else if(e.key === "Escape"){ closeSuggest(); }
});
document.addEventListener("click", function(e){
  var box = document.getElementById("suggest");
  if(!box.hidden && !e.target.closest(".addwrap")) closeSuggest();
});
document.getElementById("btn-settings").addEventListener("click", openSettings);

(function(){
  if(typeof firebase === "undefined" || !firebase.firestore){
    banner("לא הצלחנו לטעון את שירות הסנכרון — המכשיר הזה עובד על עותק מקומי.");
    return;
  }

  var fs;
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    fs = firebase.firestore();
  }catch(e){
    banner("אין חיבור לרשימה המשותפת — עובדים על המכשיר הזה בלבד.");
    return;
  }

  /* Keeps the list usable in a shop with no signal; writes replay on
     reconnect. Harmless if the browser or another tab refuses it. */
  if(typeof fs.enablePersistence === "function"){
    try{
      var p = fs.enablePersistence({synchronizeTabs:true});
      if(p && p.catch) p.catch(function(){});
    }catch(e){}
  }

  /* One shared list, addressed the way the rest of the code already expects:
     db.collection("items") and db.doc("items/<id>"). */
  var base = fs.collection("lists").doc(LIST_ID);
  db = {
    collection: function(name){ return base.collection(name); },
    doc: function(path){
      var parts = path.split("/");
      return base.collection(parts[0]).doc(parts.slice(1).join("/"));
    }
  };
  local = false;

  var onErr = function(e){
    banner(((e && e.code) === "permission-denied")
      ? "הרשימה נעולה — צריך לעדכן את חוקי הגישה ב-Firebase."
      : "החיבור לרשימה המשותפת נותק. הוא יתחבר מחדש בעצמו.");
  };

  db.collection("items").onSnapshot(function(snap){
    var next = {};
    snap.docs.forEach(function(doc){
      var v = doc.data() || {};
      var item = {
        id: doc.id,
        name: String(v.name || ""),
        qty: String(v.qty || ""),
        cat: String(v.cat || "other"),
        addedBy: String(v.addedBy || ""),
        done: !!v.done,
        ts: Number(v.ts) || 0
      };
      if(v.urgent) item.urgent = true;
      /* Left off entirely when absent, so items without one don't grow an
         empty field the next time they're written. */
      if(isPhoto(v.img)) item.img = v.img;
      next[doc.id] = item;
    });
    state.items = next;
    render();
  }, onErr);

  db.collection("catalog").onSnapshot(function(snap){
    var next = {};
    snap.docs.forEach(function(doc){
      var v = doc.data() || {};
      next[doc.id] = {name:String(v.name || doc.id), cat:String(v.cat || "other")};
    });
    state.catalog = next;
    render();
  }, onErr);

  db.collection("packs").onSnapshot(function(snap){
    var next = {};
    snap.docs.forEach(function(doc){
      var v = doc.data() || {};
      var lines = Array.isArray(v.items) ? v.items.map(String).filter(Boolean) : [];
      if(v.name && lines.length) next[doc.id] = {name:String(v.name), items:lines, ts:Number(v.ts) || 0};
    });
    state.packs = next;
    render();
    refreshPackSheet();
  }, onErr);

  db.collection("links").onSnapshot(function(snap){
    var next = {};
    snap.docs.forEach(function(doc){
      var v = doc.data() || {};
      if(v.key) next[doc.id] = {key:String(v.key), name:String(v.name || "")};
    });
    state.links = next;
    refreshPrices();
  }, onErr);
})();

})();
</script>

</body>
</html>
